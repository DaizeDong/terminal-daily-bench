[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terminal-daily-bench"
version = "0.1.0"
description = "A living coding-agent benchmark graded by protected-test execution replay."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"  # tomllib (stdlib) since 3.11
keywords = ["benchmark", "coding-agent", "llm-evaluation", "execution", "living-benchmark"]
authors = [{ name = "terminal-daily-bench contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
]
dependencies = []            # scoring core is pure stdlib; harbor/apptainer are host tools

[project.optional-dependencies]
dev = ["pytest>=7"]
replay = ["cryptography>=41"]

[project.scripts]
tdb = "terminal_daily_bench.cli:main"

[project.urls]
Homepage = "https://tbench-daily.example"       # set to the public site on publish
Repository = "https://github.com/OWNER/terminal-daily-bench"

[tool.hatch.build.targets.wheel]
packages = ["terminal_daily_bench"]

[tool.pytest.ini_options]
# Archived benchmark packages intentionally contain many verifier files with
# the same basename.  They are executed in isolated Harbor tasks, not imported
# together as this package's unit-test suite.
testpaths = ["tests"]
