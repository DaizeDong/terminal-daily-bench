<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="../assets/tw.css?v=7d2e76d680">
<link rel="stylesheet" href="../assets/site.css?v=7d2e76d680">

</head>
<body class="tdb-results">
<main id="nd-home-layout" class="flex flex-1 flex-col pt-14">
  <div class="tdb-page-container tdb-result-frame" data-tdb-canary-host>
    <div class="tdb-page-heading tdb-result-heading">
      <div class="tdb-heading-title"><h1 id="title">Leaderboard</h1><p id="result-subtitle" hidden></p></div>
      <div class="tdb-heading-meta"><p id="count">Loading&hellip;</p><div id="daynav"></div></div>
    </div>
    <section class="tdb-shell">
      <div class="tdb-tablebar">
        <div class="tdb-viewswitch" id="views" role="group" aria-label="Table view"></div>
        <div id="facet-box" hidden><div id="facets"></div></div>
        <label class="tdb-shell-search"><span class="sr-only">Search leaderboard</span>
          <input id="q" type="search" placeholder="Search models" autocomplete="off">
        </label>
      </div>
      <p id="view-note" class="tdb-view-note" role="status" hidden></p>
      <div id="cap-legend" class="tdb-cap-legend" hidden></div>
      <div class="tdb-shell-body">
        <div id="task-explorer" hidden></div>
        <div id="insights" class="tdb-insights" hidden></div>
        <div id="results-scroll" data-slot="table-container" data-tdb-primary-data>
          <table data-slot="table" class="tdb-results-table" id="results-table">
            <thead data-slot="table-header" id="head"></thead>
            <tbody data-slot="table-body" id="body"></tbody>
          </table>
        </div>
      </div>
      <p id="measurement-note" hidden></p>
      <details class="tdb-methods">
        <summary>Methods</summary>
        <div id="foot" class="tdb-foot"></div>
      </details>
    </section>
  </div>
</main>

<script src="../assets/site.js?v=7d2e76d680" data-root=".." data-page="leaderboard"></script>
<script src="../assets/tdb-data.js?v=7d2e76d680"></script>
<script src="../assets/tdb-explorer.js?v=7d2e76d680"></script>
<script src="../assets/tdb-insights.js?v=7d2e76d680"></script>
<script src="../assets/tdb-share.js?v=7d2e76d680"></script>
<script>
(function () {
  "use strict";
  var T = window.TDB;
  var esc = T.esc, TD = T.TD, TR = T.TR, TH = T.TH;
  var byId = function (id) { return document.getElementById(id); };
  var taskExplorer = T.createTaskExplorer(byId("task-explorer"), function (counts) {
    if (MODE === "tasks" && loadState === "idle") {
      byId("count").innerHTML = (counts.available ? counts.models + " models · " + counts.tasks + " tasks" : "Task outcomes") + officialBadge(DAY);
    }
  });
  var loadSequence = 0, loadState = "idle";
  T.currentTaskExplorer = taskExplorer;
  var insights = T.createInsights(byId("insights"), {
    onChange: function (snapshot) {
      if (isInsightMode()) {
        var unit = MODE === "efficiency" ? "setting" : MODE === "profile" ? "capability" : "matching task";
        byId("count").textContent = snapshot.rows.length ? snapshot.rows.length + " " + unit + (snapshot.rows.length === 1 ? "" : "s") : "";
      }
      resultsChanged();
    },
    onNavigate: navigateInsight,
    onSetting: function (scaffold) { var parts = splitScaffold(scaffold); facet.agent = parts.agent; facet.effort = parts.effort || "default"; }
  });
  function isInsightMode() { return ["compare", "profile", "efficiency", "history"].indexOf(MODE) >= 0; }
  function resultsChanged() { document.dispatchEvent(new CustomEvent("tdb:results")); }
  function navigateInsight(view, model) {
    if (model) insights.select(model);
    MODE = view; byId("q").value = ""; applyFilter();
  }
  T.leaderboardContext = function () { return { day: DAY, site: siteData, cap: capData }; };
  T.leaderboardSnapshot = function () {
    if (loadState !== "idle" || !DAY || !DAY.date || (MODE === "capability" && !CAP)) return { date: "", view: MODE, title: "Results unavailable", columns: [], rows: [], notes: ["Results are loading."] };
    if (isInsightMode()) return insights.snapshot();
    if (MODE === "tasks" && taskExplorer.snapshot) return taskExplorer.snapshot();
    var columns = COLS.map(function (c) { return { key: c.key, label: c.label, type: c.key === "rate" || c.axis || c.key === "overall" ? "percent" : ["rank", "n", "solved", "fa"].includes(c.key) ? "number" : "text" }; });
    var extra = [{key: "effort", label: "Effort", type: "text"}, {key: "evaluated", label: "Evaluated tasks", type: "number"}, {key: "row_type", label: "Row type", type: "text"}];
    columns.filter(function (c) { return c.type === "percent"; }).forEach(function (c) {
      extra.push({key: c.key + "_sd", label: c.label + " run standard deviation", type: "percent"});
      extra.push({key: c.key + "_runs", label: c.label + " runs", type: "number"});
    });
    if (MODE === "capability") {
      extra.unshift({key: "agent", label: "Agent", type: "text"});
      COLS.filter(function (c) { return c.axis; }).forEach(function (c) {
        extra.push({key: c.key + ":n", label: c.label + " tasks", type: "number"});
        extra.push({key: c.key + ":labels", label: c.label + " labels", type: "text"});
      });
    }
    var setting = splitScaffold(MODE === "capability" ? CAP.summary.scaffold || "" : "");
    var exportRows = sortRows(VIEW).flatMap(function (r) {
      return MODE !== "capability" && expandedModels.has(r.model) ? [r].concat((r.variants || []).map(function (v) {
        return Object.assign({}, v, {rank: null, exportVariant: true});
      })) : [r];
    });
    return { date: DAY.date, view: MODE, title: MODE === "capability" ? "Capability results" : "Overall results", columns: columns.concat(extra),
      imageColumns: MODE === "capability" ? undefined : ["rank", "model", "agent", "effort", "rate", "n"],
      rows: exportRows.map(function (r) {
        var out = {}; COLS.forEach(function (c) { out[c.key] = c.value ? c.value(r) : r[c.key]; });
        COLS.filter(function (c) { return c.key === "rate" || c.key === "overall" || c.axis; }).forEach(function (c) {
          var tally = MODE === "capability" ? (c.axis ? r.axis[c.axis.code] : r.overall) : r;
          var estimate = pointEstimate(tally);
          out[c.key] = estimate ? estimate.p : null;
          out[c.key + "_sd"] = estimate ? estimate.sd : null;
          out[c.key + "_runs"] = estimate ? estimate.runs : null;
        });
        out.agent = MODE === "capability" ? setting.agent : r.agent;
        out.effort = MODE === "capability" ? (setting.effort || "default") : (r.effort || "default");
        out.evaluated = MODE === "capability" ? r.overall.n : r.n;
        out.row_type = r.exportVariant ? "Effort detail" : "Model summary";
        COLS.filter(function (c) { return c.axis; }).forEach(function (c) {
          out[c.key + ":n"] = r.axis[c.axis.code].n;
          out[c.key + ":labels"] = c.axis.nDeclared ? "Preliminary" : "Verified";
        });
        return out;
      }),
      notes: [byId("measurement-note").textContent, byId("result-subtitle").textContent].filter(Boolean) };
  };

  /* Two published files besides the day itself, and BOTH of them are
     day-independent by construction.

     site_data.json is the task catalogue: it is what makes the reproduce
     command name a task a reader may actually run, and it carries the
     publication mode every task was measured under. data/capability.json is
     the axis catalogue: fourteen axis codes, their names, the task ids that
     carry them and the publish gate. Neither file holds a measurement, so
     neither goes stale when the day picker moves.

     WHAT USED TO BE HERE, AND WHY IT IS GONE. A third global, boardData, held
     leaderboard_data.json -- the whole-site snapshot whose own `date` field is
     fixed at 2026-09-10. It was read once at boot and never again, and two
     things on this page were built from it: the capability view and the
     discrimination digest. Both are per-day quantities computed from a solve
     matrix, and every day file publishes its own `matrix` in exactly the shape
     leaderboard_data.json publishes it. So on six of the seven selectable days
     the page printed 2026-09-10's numbers under another day's header: the "By
     capability" table read 342 tasks x 33 models while the header above it said
     338 x 33 (2026-09-05, 2026-09-04) or 366 x 31 (2026-09-03), and on the
     three days whose file carries NO matrix at all -- 2026-09-06, 2026-08-19,
     2026-07-23 -- a full, confident capability table of a different suite sat
     under a header for a day that measured nothing of the kind. Both call
     sites now take the day that show() was handed, so there is nothing left
     that reads the global snapshot and the fetch is gone with it. If a future
     line genuinely needs a cross-day figure it must say which day it describes
     in its own sentence; it cannot borrow this page's day picker.

     Both files are read once at boot and both fail loudly: a null here means
     "could not be read", never "there is nothing there", and every line below
     that depends on one of them is omitted rather than guessed. */
  var siteData = null, capData = null;

  /* Raised by faCell() while a body is built: at least one non-zero False
     accepts count had no evidence record to point at, and the foot has to say
     so rather than let an unlinked number look audited. */
  var faUnlinked = false;

  /* The shipped angle-bracket string, kept so a day with no runnable command
     falls back to a template that is obviously a template -- never to a
     half-substituted command. */
  var cmdPlaceholder = byId("cmd") ? byId("cmd").textContent : "";

  /* The shipped label of the task-ids link, kept for the same reason: heading()
     rewrites this element on every day change, in both directions, and a label
     it had to spell out itself would be a second copy of a string the markup
     already owns. Read as textContent, so "&rarr;" arrives here as the arrow it
     renders as rather than as its source. */
  var tasksLabel = byId("cmd-tasks") ? byId("cmd-tasks").textContent : "";

  /* ------------------------------------------------------------------ *
   * The provenance block, as copy.
   *
   * Held as named constants rather than inlined so the sentences a reader is
   * asked to trust can be read in one place, and so every expression that
   * builds markup below stays short enough to check by eye. Nothing here
   * carries a number: every count in the foot is interpolated at render time
   * from the day file and the two published data files.
   *
   * WHY THESE ARE TERMS AND NOT PARAGRAPHS. The foot was eight paragraphs of
   * standing definitions, and a standing definition read as a paragraph is
   * read once and then skipped forever. Each one answers "what does this word
   * on the table mean", so each is a term and its definition, in the same
   * <dl class="tdb-limits"> this site already uses for a claim and its
   * consequence. Same claims, a third fewer words, and a reader looking up one
   * of them can find it without reading the other three.
   *
   * The words that were cut were cut, not moved into a tooltip. What each
   * definition still asserts is: who ran it and what a submitted reward is
   * worth; how many attempts over how many models, configurations and tasks;
   * what accuracy divides and what the interval beside it measures; that a run
   * with no accepted result is a null, not a zero; and that semantic
   * false-accept was not measured at all. Every one of those was load bearing
   * and every one is still here.
   * ------------------------------------------------------------------ */
  var DEF_CELLS =
    "Maintainer-run. A " +
    '<a href="../submit/">submitted</a> reward is only a claim until an ' +
    '<a href="../guide/submission/#operator-replay">operator replays it</a> ' +
    "under protected tests.";

  var DEF_OUTCOMES =
    "A run with no accepted result is <code>outcome:null</code>: counted in " +
    'coverage, <a href="../guide/quality-methods/#outcomes">not a failure</a>.';

  var LINK_QUALITY =
    '<a href="../quality/#discrimination">Benchmark quality</a>';

  /* One row per (model, scaffold). A scaffold id is "<agent>" or
     "<agent>@<effort>" -- claude-code@high, codex@low, terminus-2 -- so the
     reference's Agent / Effort split falls straight out of the id. An id with
     no "@" ran at the provider's default and says so, rather than being given a
     made-up effort name. */
  function hasOwn(obj, key) {
    return Object.prototype.hasOwnProperty.call(obj, key);
  }

  function splitScaffold(id) {
    var at = String(id).indexOf("@");
    return at < 0
      ? { agent: String(id), effort: null }
      : { agent: String(id).slice(0, at), effort: String(id).slice(at + 1) };
  }

  function flatten(day) {
    var out = [];
    (day.leaderboard || []).forEach(function (entry) {
      Object.keys(entry).forEach(function (k) {
        var cell = entry[k];
        if (!cell || typeof cell !== "object" || typeof cell.n !== "number") return;
        if (!cell.n) return;                       /* never measured: not a row */
        var s = splitScaffold(k);
        var repeat = T.resultStats(day, entry.model, k);
        if (repeat && repeat.n !== cell.n) repeat = null;
        out.push({
          model: entry.model, agent: s.agent, effort: s.effort, scaffold: k,
          n: cell.n, solved: cell.solved,
          /* Rank and display use the same unrounded estimate. */
          repeat: repeat,
          rate: cell.solved / cell.n,
          fa: cell.fa, fa_n: cell.fa_n, fa_evidence: cell.fa_evidence
        });
      });
    });
    return out;
  }

  /* ------------------------------------------------------------------ *
   * The score bar.
   *
   * A length beside every rate, so 354 percentages can be compared by shape
   * instead of by reading. Geometry copied from the reference: a 12px square
   * track, the fill monochrome at 80% of the ink, nothing written inside it.
   *
   * THE TRAP THIS FUNCTION EXISTS TO AVOID. A rate is not two-state. A cell
   * can be 1, 0, or never attempted, and 15 of this day's 600 grid cells are
   * the third. `width: (rate || 0)` renders all three: a never-run
   * configuration comes out as a full-length empty track, pixel-identical to a
   * configuration that ran all 50 tasks and solved none. One of those is a
   * measurement and the other is a gap in coverage, and a bar that cannot tell
   * them apart is worse than no bar, because it looks like it knows.
   *
   * So the unmeasured case returns null -- not zero, not an empty string --
   * and accuracyCell() draws an em dash with NO TRACK AT ALL. There is no
   * `|| 0` anywhere below and there must never be one: the fallback IS the
   * bug. flatten() already refuses to emit a row for a cell with no attempts,
   * so this is the second of two independent refusals rather than the only
   * one.
   * ------------------------------------------------------------------ */
  /* A SECOND refusal, learned from a mutation test. barCell used to validate
   * r.rate while the number beside it was computed from r.solved. Renaming
   * `solved` in the day JSON produced exactly the cell this comment swears
   * cannot exist: `NaN%` next to a confidently drawn 30% bar. Two fields, two
   * validations, and nothing asserting they agree -- so the bar could outlive
   * the number it was supposed to depict. The bar now takes an already
   * validated point estimate as its argument and computes nothing itself,
   * which is why it can no longer be drawn for a value that does not exist. */
  function barCell(p) {
    var width = Math.max(0, Math.min(100, p * 100));
    return '<span class="tdb-acc-track" aria-hidden="true">' +
      '<span class="tdb-acc-fill" style="width:' + width.toFixed(2) + '%"></span></span>';
  }

  /* The one gate both the bar and the number pass through. Returns null for
     anything that is not a measurement; there is no `|| 0` and there must
     never be one. */
  function pointEstimate(r) {
    if (!r || typeof r.n !== "number" || !isFinite(r.n) || !r.n) { return null; }
    if (typeof r.solved !== "number" || !isFinite(r.solved)) { return null; }
    var w = T.scoreEstimate(r.solved, r.n, r.repeat);
    if (!w || typeof w.p !== "number" || !isFinite(w.p)) { return null; }
    return w;
  }

  /* Keep mean and observed run variation beside the same full-width bar. */
  function accuracyCell(r) {
    return T.scoreCell(r.solved, r.n, r.repeat);
  }

  /* Rank is sortable. It was the one inert header, and it is the column a
     reader most needs to get back to after sorting by something else -- a
     table you can leave but not return to is a worse table than one you cannot
     sort. `value` is spelled out on every column so the sort reads a declared
     accessor rather than guessing from the key.

     `right` is a claim about the DATA, not a look: rank, accuracy, solved and
     tasks are quantities and sit flush right in the header and in every row;
     agent, model and effort are names and stay flush left. The header takes
     its side from the same flag the cell does, so the two cannot disagree.

     FALSE ACCEPTS IS NOT IN THIS LIST. It is appended by show() only when a
     published cell carries a count -- see faColumn(). Neither published day
     does, so the column would be 354 identical em dashes, and a column of
     dashes is not a disclosure: it is 354 chances to read "we measured zero"
     where the truth is "we did not measure". The foot says so in a sentence
     instead. */
  var COLS_BASE = [
    { key: "rank", label: "Rank", right: true, dir: "asc", value: function (r) { return r.rank; } },
    { key: "model", label: "Model", dir: "asc", value: function (r) { return r.model; } },
    { key: "agent", label: "Agent", dir: "asc", value: function (r) { return r.agent; } },
    { key: "rate", label: "Success rate", dir: "desc", value: function (r) { return r.rate; } },
    { key: "n", label: "Tasks", right: true, dir: "desc", value: function (r) { return r.n; } }
  ];
  var COL_FA = { key: "fa", label: "False accepts", right: true, dir: "desc",
      value: function (r) { return (typeof r.fa === "number") ? r.fa : null; } };
  var COLS = COLS_BASE.slice();

  /* The column exists if and only if some row published a number for it. A
     count of zero IS a measurement and keeps the column; null is not. */
  function faColumn(rows) {
    for (var i = 0; i < rows.length; i++) {
      if (typeof rows[i].fa === "number" && isFinite(rows[i].fa)) { return true; }
    }
    return false;
  }

  var ALL = [], VIEW = [], DAYS = [], DAY = {};
  var expandedModels = new Set();
  var capAxis = "all", capColor = "rate", capColors = null;

  /* Which of the two views of this table is on screen. "overall" is every
     measured (model, scaffold) row of the day; "capability" is the solve
     matrix joined to the published capability axes. It is one variable and
     not two components: every control below reads it, and there is exactly
     one <table> for it to change. */
  var MODE_DEFAULT = "overall";
  var MODE = MODE_DEFAULT;
  var VIEWS = [
    { key: "overall", label: "Overall" },
    { key: "capability", label: "Capabilities" },
    { key: "tasks", label: "Task outcomes" },
    { key: "compare", label: "Compare" },
    { key: "efficiency", label: "Efficiency" }
  ];

  function capMode() { return MODE === "capability" && !!CAP; }
  function activeRows() { return capMode() ? CAP.rows : ALL; }

  /* A penalty a reader cannot check is an accusation, not a measurement. Where
     the cell names the record that produced the count -- the failing protected
     test, the replay trial -- the number IS that link. Where it does not, the
     number stays plain text and the foot says that no evidence record is
     published, because an unlinked number dressed as a linked one is worse
     than the plain one it replaced. Zero is never linked: there is nothing to
     audit, and a link would imply there were. */
  function faCell(r) {
    var count = r.fa;
    if (typeof count !== "number") {
      return '<span class="text-muted-foreground">&mdash;</span>';
    }
    var text = esc(count) + "/" + esc(r.fa_n);
    var href = count ? r.fa_evidence : null;
    if (count && (typeof href !== "string" || !href)) {
      faUnlinked = true;
      href = null;
    }
    return href ? '<a href="' + esc(href) + '">' + text + "</a>" : text;
  }

  /* One <td> per column and nothing inside it but the value. Every cell used
     to wrap its content in a <p> that carried the alignment and the colour --
     eight per row, 2832 elements on a 354-row day, not one of them a paragraph
     and not one saying anything the <td> could not say itself. The alignment
     now lives on the cell, which is the same element the header is aligned
     from, so a column cannot be flush right in the body and flush left in the
     head. */
  function cell(cls, html, label) {
    return '<td data-slot="table-cell" class="' + TD + cls + '"' +
      (label == null ? "" : ' data-label="' + esc(label) + '"') + '>' + html + "</td>";
  }

  function render(r, child) {
    var modelHtml = child ? '<span class="tdb-effort-label">' + esc(r.effort || "default") + '</span>'
      : T.modelToggle(r, expandedModels.has(r.model));
    var attrs = child ? ' class="tdb-effort-row"'
      : ' class="' + TR + '" data-model-group="' + esc(r.model) + '"';
    var out = '<tr data-slot="table-row"' + attrs + '>' +
      cell(" tdb-num text-muted-foreground", child ? "" : esc(r.rank)) +
      cell("", modelHtml) + cell(" text-muted-foreground", esc(T.agentLabel(r.agent))) +
      cell(" tdb-score-cell", accuracyCell(r)) +
      cell(" tdb-num text-muted-foreground", esc(r.n));
    if (COLS.length > COLS_BASE.length) { out += cell(" tdb-num", faCell(r)); }
    out += "</tr>";
    if (!child && expandedModels.has(r.model)) {
      out += r.variants.map(function (v) { return render(v, true); }).join("");
    }
    return out;
  }

  /* ------------------------------------------------------------------ *
   * Sort.
   *
   * .tdb-sort had rules in the stylesheet and nothing wired to them: every
   * header on this page was inert text. It is a control now, and three things
   * about it are decisions rather than defaults.
   *
   * NULL IS NOT ZERO, IN EITHER DIRECTION. `fa` is null wherever no
   * false-accept trial was run, and `effort` is null wherever a scaffold ran
   * at the provider's default. Sorting those as 0 would file "never measured"
   * among the best possible scores ascending and among the worst descending,
   * which is a ranking invented out of a gap. They sink to the bottom both
   * ways, and the tie-break behind them is rank, so the unmeasured block stays
   * in a stable, meaningful order rather than an arbitrary one.
   *
   * RANK IS THE DEFAULT AND IS ITSELF SORTABLE. Rank is assigned once over the
   * whole day and travels with the row (see show()), so it is the way back
   * from any other order.
   *
   * THE ORDER IS IN THE URL. A sorted, filtered view is a thing people paste
   * to each other. It is written with replaceState rather than pushState: the
   * back button on this page means "the previous DAY", and turning every
   * header click into a history entry would bury that.
   * ------------------------------------------------------------------ */
  var SORT_KEY_DEFAULT = "rank", SORT_DIR_DEFAULT = "asc";
  var sortKey = SORT_KEY_DEFAULT, sortDir = SORT_DIR_DEFAULT;

  /* Lucide chevrons, drawn rather than typed. The site ships one self-hosted
     family and a glyph-level coverage test; a caret written as a character
     would be drawn by whatever face the reader's OS chose for it. Each is a
     whole string literal, not a shared prefix plus a path, because a constant
     assembled from another constant is not a constant this page's markup
     audit can follow. */
  var I_SORT_NONE = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 15 5 5 5-5"></path><path d="m7 9 5-5 5 5"></path></svg>';
  var I_SORT_ASC = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg>';
  var I_SORT_DESC = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>';

  function colByKey(k) {
    for (var i = 0; i < COLS.length; i++) {
      if (COLS[i].key === k) { return COLS[i]; }
    }
    return null;
  }

  function isBlank(v) {
    return v === null || v === undefined || v === "";
  }

  function sortRows(rows) {
    var col = colByKey(sortKey) || COLS[0];
    var get = col.value;
    var asc = (sortDir === "asc");
    return rows.slice().sort(function (a, b) {
      var av = get(a), bv = get(b);
      var an = isBlank(av), bn = isBlank(bv);
      if (an !== bn) { return an ? 1 : -1; }   /* unmeasured sinks, both ways */
      if (an && bn) { return a.rank - b.rank; }
      if (typeof av === "number" && typeof bv === "number") {
        if (av === bv) { return a.rank - b.rank; }
        return asc ? av - bv : bv - av;
      }
      var c = String(av).localeCompare(String(bv));
      if (c === 0) { return a.rank - b.rank; }
      return asc ? c : -c;
    });
  }

  /* A column that cannot order the table is not given a control that says it
     can. `col.static` renders the label as text -- the stylesheet already
     ships .tdb-sort[data-static="true"] for exactly this -- and the header
     click handler ignores it, so the refusal is enforced by the code rather
     than promised in a footnote.

     `col.noteHtml` is the second line under a label: what the column is
     measured on, and how wide its interval is. It belongs at the head and not
     in every cell, because n is a property of the COLUMN -- fourteen copies of
     the same interval down a column is noise, and one at the top is the
     reading the whole column has to be taken under. */
  function headCell(col) {
    var key = col.key, label = capMode() ? (col.shortLabel || col.label) : col.label;
    var stat = !!col.static;
    var on = !stat && (key === sortKey);
    var icon = !on ? I_SORT_NONE : (sortDir === "asc" ? I_SORT_ASC : I_SORT_DESC);
    var aria = on ? (sortDir === "asc" ? "ascending" : "descending") : "none";
    var side = col.right ? "right" : "left";
    var colClass = { rank: "tdb-col-rank", model: "tdb-col-model", agent: "tdb-col-agent", n: "tdb-col-count", solved: "tdb-col-count", overall: "tdb-col-overall" }[key] || (col.axis ? "tdb-col-capability" : "");
    var description = col.axis ? capAxisDescription(col.axis) : col.label;
    var control = stat
      ? '<span class="tdb-sort" data-static="true">' + esc(label) + "</span>"
      : '<button type="button" class="tdb-sort" data-key="' + esc(key) + '"' +
        (on ? ' data-active="true"' : "") +
        ' aria-label="Sort by ' + esc(col.label) + '">' + esc(label) + icon + "</button>";
    var note = col.noteHtml
      ? '<span class="tdb-col-note" data-align="' + side + '">' + col.noteHtml + "</span>"
      : "";
    var axisAttr = col.axis ? ' data-capability="' + esc(col.axis.code) + '"' : '';
    return '<th data-slot="table-head" scope="col" class="' + TH + ' ' + colClass + '" aria-sort="' + aria +
      '" title="' + esc(description) + '"' + axisAttr + '>' +
      '<span class="tdb-sort-wrap" data-align="' + side + '">' + control + "</span>" +
      note + "</th>";
  }

  function headHtml() {
    var out = "";
    for (var i = 0; i < COLS.length; i++) {
      out += headCell(COLS[i]);
    }
    return '<tr class="' + TR + '">' + out + "</tr>";
  }

  /* ------------------------------------------------------------------ *
   * Filter pills.
   *
   * The dimensions are the ones the row objects actually carry. flatten()
   * splits a scaffold id into `agent` and `effort` -- claude-code@high becomes
   * {agent: "claude-code", effort: "high"} -- and those two are the whole of
   * the categorical structure here. `model` is 152 values and is what the
   * search box is for; nothing else on a row is a facet, and none is invented.
   *
   * A pill's count is a leave-one-out count: what you would get if you clicked
   * it, with the search box and the OTHER group's selection still applied but
   * this group's ignored. A count computed over the unfiltered set would
   * advertise 130 on a chip that returns 12.
   *
   * A pill matching nothing is disabled, not removed. The published
   * configurations do not pair every agent with every effort, so a combination
   * like single_shot + high is empty -- and an effort that silently vanishes
   * from the rail reads as an effort nobody ran, which is a different claim.
   * ------------------------------------------------------------------ */
  /* A chip is a rectangle you press: one border, one height, and the only
     thing that changes when you press it is the weight of the ink in it.

     The selected state used to be `bg-secondary`, which the stylesheet reads
     as a page-level button and gives `min-height: 3rem`. Measured, that made
     the pressed chip 48px tall in a rail of 32px chips: the row grew by 16px
     under the cursor on every click. Nothing here names a `bg-*` colour, so
     nothing here can pick that rule up again. The focus ring is the site's
     one global `button:focus-visible` outline; it needed no classes. */
  var CHIP_BASE = "tdb-chip inline-flex shrink-0 items-center h-8 px-3 border text-sm " +
    "whitespace-nowrap transition-colors disabled:pointer-events-none " +
    "disabled:opacity-50 ";
  var CHIP_IDLE = "text-muted-foreground hover:text-foreground";
  var CHIP_SEL = "text-foreground font-medium";

  function chipClass(on) {
    return CHIP_BASE + (on ? CHIP_SEL : CHIP_IDLE);
  }

  var GROUPS = ["agent", "effort"];
  var GROUP_LABEL = { agent: "Agent", effort: "Effort" };
  var facet = { agent: null, effort: null };
  var facetValues = { agent: [], effort: [] };

  /* A row's value on a facet. An effort of null means the scaffold ran at the
     provider's default -- a real, nameable state, and the pill says so rather
     than leaving most of the board unreachable by any pill. */
  function facetValue(r, group) {
    return (group === "effort") ? (r.effort || "default") : r.agent;
  }

  function matchesOther(r, skip) {
    for (var i = 0; i < GROUPS.length; i++) {
      var g = GROUPS[i];
      if (g === skip || !facet[g]) { continue; }
      if (facetValue(r, g) !== facet[g]) { return false; }
    }
    return true;
  }

  /* A capability row has no agent and no effort -- the whole grid is one
     scaffold -- so the haystack is the model name alone rather than the model
     name plus two fields that are the same on every row. */
  function matchesQuery(r, q) {
    if (!q) { return true; }
    var model = r.model + " " + T.modelLabel(r.model);
    var hay = capMode()
      ? model
      : (model + " " + r.agent + " " + T.agentLabel(r.agent) + " " + (r.effort || "default"));
    return hay.toLowerCase().indexOf(q) >= 0;
  }

  function looCount(group, value, q) {
    var models = new Set();
    ALL.forEach(function (r) {
      if (!matchesQuery(r, q)) { return; }
      if (!matchesOther(r, group)) { return; }
      if (facetValue(r, group) === value) { models.add(r.model); }
    });
    return models.size;
  }

  function collectFacets(rows) {
    var found = { agent: {}, effort: {} };
    rows.forEach(function (r) {
      GROUPS.forEach(function (g) { found[g][facetValue(r, g)] = 1; });
    });
    return {
      agent: Object.keys(found.agent).sort(),
      effort: Object.keys(found.effort).sort()
    };
  }

  function chip(group, value, on, count) {
    var attrs = 'type="button" data-group="' + esc(group) +
      '" data-value="' + esc(value) + '" aria-pressed="' + (on ? "true" : "false") + '"';
    if (!count && !on) { attrs += ' disabled aria-disabled="true"'; }
    return "<button " + attrs + ' class="' + chipClass(on) + '">' +
      esc(value) + " " + esc(count) + "</button>";
  }

  function paintFacets(q) {
    var box = byId("facet-box"), rail = byId("facets");
    if (!box || !rail) { return; }
    if (MODE === "tasks" || (isInsightMode() && MODE !== "efficiency")) { rail.innerHTML = ""; box.hidden = true; return; }
    if (capMode()) {
      var optionsHtml = CAP.axes.map(function (a) {
        var selected = capAxis === a.code ? ' selected' : '';
        return '<option value="' + esc(a.code) + '"' + selected + '>' +
          esc(a.name + " (" + a.n + ")") + '</option>';
      }).join("");
      var capSelectHtml = '<label class="tdb-filter-label"><span class="sr-only">Capability</span>' +
        '<select id="cap-axis"><option value="all"' +
        (capAxis === "all" ? ' selected' : '') + '>All capabilities</option>' + optionsHtml + '</select></label>';
      var capColorHtml = '<label class="tdb-filter-label"><span class="sr-only">Cell colors</span>' +
        '<select id="cap-color"><option value="rate"' + (capColor === "rate" ? ' selected' : '') +
        '>Success rate</option><option value="peers"' + (capColor === "peers" ? ' selected' : '') +
        '>Relative to peers</option></select></label>';
      rail.innerHTML = capSelectHtml + capColorHtml;
      box.hidden = false;
      return;
    }
    var html = "";
    GROUPS.forEach(function (g) {
      var values = facetValues[g] || [];
      if (values.length < 2) { return; }
      var optionsHtml = values.map(function (v) {
        var selected = facet[g] === v ? ' selected' : '';
        var disabled = !looCount(g, v, q) && !selected ? ' disabled' : '';
        return '<option value="' + esc(v) + '"' + selected + disabled + '>' + esc(v) + '</option>';
      }).join("");
      html += '<label class="tdb-filter-label"><span class="sr-only">' + esc(GROUP_LABEL[g]) + '</span>' +
        '<select data-group="' + esc(g) + '"><option value="">' +
        esc(g === "effort" ? (MODE === "efficiency" ? "All efforts" : "Highest effort") : "All agents") + '</option>' + optionsHtml + '</select></label>';
    });
    if (facet.agent || facet.effort || q) { html += '<button type="button" id="facet-reset">Reset</button>'; }
    rail.innerHTML = html;
    box.hidden = !html;
  }

  /* The switch between the two views. It is built from the same chip the
     filter rail uses, because it does the same job -- it narrows what the one
     table below is showing -- and a second control idiom for the same act
     would read as a second table.

     The capability chip is disabled, not hidden, when the join could not be
     made. A control that vanishes says the view does not exist; a control
     that is present and refuses says the data for it could not be read, which
     is what actually happened. */
  function paintViews() {
    var rail = byId("views");
    if (!rail) { return; }
    var html = "";
    VIEWS.forEach(function (v) {
      var on = (MODE === v.key);
      var off = (v.key === "capability") && !CAP;
      var attrs = 'type="button" data-view="' + esc(v.key) +
        '" aria-pressed="' + (on ? "true" : "false") + '"';
      if (off) { attrs += ' disabled aria-disabled="true"'; }
      html += "<button " + attrs + ' class="' + chipClass(on) + '">' +
        esc(v.label) + "</button>";
    });
    rail.innerHTML = html;
  }

  /* ------------------------------------------------------------------ *
   * The sentence that goes with the refusal.
   *
   * The disabled chip above is necessary and not sufficient. It reports that
   * something is unavailable; it cannot say WHAT, and a reader who arrived on
   * a matrix-less day through a ?view=capability link is shown the board view
   * under a URL that asked for the other one, with a greyed-out chip as the
   * only trace. That is a failure rendering as an absence -- the reader's
   * most likely reading is that the capability view simply has nothing to
   * show today, when the truth is that this day's file carries no per-cell
   * grid to compute one from.
   *
   * So: name the day, name the missing input, and say what the day DOES
   * publish, so the absence is bounded. Three causes are distinguished
   * because the reader can act on two of them -- a failed catalogue fetch is
   * a site problem to report, a matrix-less day is a property of that day and
   * another day will have one -- and conflating them would make both
   * unactionable. The count of published per-model rows is printed with its
   * denominator-bearing noun ("of the day's N leaderboard rows") rather than
   * bare, for the same reason every other number on this page is.
   * ------------------------------------------------------------------ */
  function capNoteHtml(day, refused) {
    if (CAP) { return ""; }
    var reason = !capData ? "Capability definitions could not be loaded."
      : (!day.matrix || !day.matrix.tasks || !day.matrix.rows || !day.matrix.rows.length)
        ? "Task-level outcomes are unavailable for this date."
        : "Capability definitions are unavailable.";
    return (refused ? "Showing overall results. " : "Capability results unavailable. ") + reason;
  }

  function paintCapNote(day, refused) {
    var box = byId("view-note");
    if (!box) { return; }
    var html = capNoteHtml(day, refused);
    box.innerHTML = html;
    box.hidden = !html;
  }

  /* The address bar is the only place a sorted, filtered view can be kept.
     replaceState, not pushState -- see the sort note above. */
  function writeUrl(q) {
    try {
      var u = new window.URL(window.location.href), sp = u.searchParams;
      ["q", "cap", "capColor", "dir"].forEach(function (key) { sp.delete(key); });
      if (q) { sp.set("query", q); } else { sp.delete("query"); }
      if (capAxis !== "all") { sp.set("capability", capAxis); } else { sp.delete("capability"); }
      if (capColor !== "rate") { sp.set("color", capColor); } else { sp.delete("color"); }
      if (MODE !== MODE_DEFAULT) { sp.set("view", MODE); } else { sp.delete("view"); }
      sp.delete("expanded");
      if (typeof expandedModels !== "undefined") Array.from(expandedModels).sort().forEach(function (model) { sp.append("expanded", model); });
      GROUPS.forEach(function (g) {
        if (facet[g]) { sp.set(g, facet[g]); } else { sp.delete(g); }
      });
      if (sortKey !== SORT_KEY_DEFAULT || sortDir !== SORT_DIR_DEFAULT) {
        sp.set("sort", sortKey);
        sp.set("order", sortDir);
      } else {
        sp.delete("sort");
        sp.delete("order");
      }
      sp.sort();
      window.history.replaceState(window.history.state, "", u);
    } catch (e) { /* file:// has no URL API for this; the table is unaffected */ }
  }

  function readUrl() {
    try {
      var sp = new window.URL(window.location.href).searchParams;
      capAxis = sp.get("capability") || sp.get("cap") || "all";
      capColor = (sp.get("color") || sp.get("capColor")) === "peers" ? "peers" : "rate";
      var v = sp.get("view");
      MODE = ["capability", "tasks", "compare", "profile", "efficiency", "history"].includes(v) ? v : MODE_DEFAULT;
      if (typeof expandedModels !== "undefined") expandedModels = new Set(sp.getAll("expanded"));
      var k = sp.get("sort"), d = sp.get("order") || sp.get("dir");
      sortKey = SORT_KEY_DEFAULT;
      sortDir = SORT_DIR_DEFAULT;
      if (k && (colByKey(k) || (MODE === "capability" && (k === "overall" || /^cap:[\w-]+$/.test(k))))) {
        sortKey = k;
        sortDir = (d === "asc") ? "asc" : "desc";
      }
      GROUPS.forEach(function (g) { facet[g] = sp.get(g) || null; });
      var q = sp.get("query") || sp.get("q");
      if (byId("q")) { byId("q").value = q || ""; }
      insights.readUrl();
    } catch (e) { /* no URL API: the defaults above stand */ }
  }

  /* ------------------------------------------------------------------ *
   * The two counters, taken from the rows the page is drawing.
   *
   * The day file publishes `n_models` and `n_cells` as headline fields, and
   * this page printed them straight above and below a table it builds from the
   * `leaderboard` array. On 2026-09-10 those fields say 33 models and 11286
   * model x scaffold x task attempts, while the same file's leaderboard array
   * holds 34 distinct model names over 70 measured cells whose `n` sums to
   * 23068. So the line above the table read "33 models" over a table listing
   * 34 of them, and the foot understated the attempt count by 11782 -- inside
   * the very block that invites a reader to check the arithmetic.
   *
   * A headline field is a claim about a pipeline run; the array is the thing on
   * screen. When the two disagree only one of them can be checked by the person
   * reading, and a counter that a table under it refutes discredits the table
   * rather than the field. So both counters are counted here, from flatten()'s
   * output. The capability view already works this way -- capabilitySummary()
   * counts matrix.rows rather than trusting a published total -- and these two
   * follow that precedent rather than inventing a second one.
   *
   * Counted over ALL and never over VIEW: this is the population the search box
   * and the pills narrow, and countHtml prints "showing N of M" against it.
   * Both refuse the `|| 0` shape: a row whose `n` is not a finite number is not
   * a zero-attempt row, it is a row flatten() would never have emitted, and
   * neither counter has any way to fabricate one.
   * ------------------------------------------------------------------ */
  function distinctModels(rows) {
    var seen = {}, n = 0;
    rows.forEach(function (r) {
      var m = r && r.model;
      if (typeof m !== "string" || hasOwn(seen, m)) { return; }
      seen[m] = 1;
      n += 1;
    });
    return n;
  }

  function totalAttempts(rows) {
    var n = 0;
    rows.forEach(function (r) {
      if (r && typeof r.n === "number" && isFinite(r.n)) { n += r.n; }
    });
    return n;
  }

  /* WHAT `day.n_tasks` IS, AND WHAT IT IS NOT. It is not the size of the
     suite. The comment that used to stand in renderFoot() said it was, and
     that sentence is what let this page print "346 tasks" for 2026-09-04
     while /benchmarks/2026-09-04/ printed "396 tasks" for the same day, with
     nothing on either page saying the two counted different things.

     web/aggregate_leaderboard.py:255 writes `"n_tasks": len(_prim_tasks)`,
     where `_prim_tasks` is the distinct task set of the PRIMARY SCAFFOLD's
     rows -- the best-covered scaffold's reduced grid, the thing the table
     below actually ranks models on. The same builder emits `union_n_tasks`
     for the cross-scaffold union, and web/build_day_data.py:180 forwards only
     `n_tasks` into the day file, so a day file has the primary-grid figure
     and no union at all. The suite roster is a different field again:
     build_day_data.py:183 copies the catalogue's own suite record into
     `day.suite`, and `day.suite.n_tasks` is the number of tasks the published
     suite contains -- which is what /benchmarks/<date>/ counts.

     Checked on all seven published days rather than on one, because the
     relationship between the two figures is not constant and a comment that
     generalises from a single day is how this defect was written in the first
     place. 2026-08-19 (50/50) and 2026-09-03 (385/385) agree; 2026-09-04
     (346/396) and 2026-09-10 (342/345) do not; and 2026-07-23, 2026-09-05 and
     2026-09-06 carry no `suite.n_tasks` to compare against -- 2026-07-23 and
     2026-09-05 because the day file has no suite record at all, 2026-09-06
     because its record has an id and nothing else. So the sentence cannot be
     written once at build time: which of the three cases holds is computed
     here, per day, and only the case that is true of the day on screen is
     printed. A missing roster figure is SAID to be missing by omitting the
     comparison, never by printing the board figure twice.

     `n_tasks` absent or non-finite would mean the builder published no count;
     that is not zero tasks, so it is named rather than rendered as a number. */
  function suiteTaskCount(day) {
    var s = day && day.suite, n = s && s.n_tasks;
    return (typeof n === "number" && isFinite(n)) ? n : null;
  }

  function boardTaskScope(day) {
    var n = day && day.n_tasks;
    if (typeof n !== "number" || !isFinite(n)) {
      return "task count unpublished";
    }
    var s = suiteTaskCount(day);
    if (s === null) { return esc(n) + " board tasks"; }
    if (s === n) { return esc(n) + " board tasks, the whole suite"; }
    return esc(n) + " board tasks of " + esc(s) + " in the suite";
  }

  /* The line above the table describes THIS view. In the capability view the
     day's own totals are the wrong numbers -- 152 models and 50 tasks belong
     to the board, while the grid under the line is 12 models of one scaffold
     -- so the counts come from the grid the reader is looking at. The official
     badge is a property of the DAY and stays either way. */
  function countHtml(q) {
    var total = capMode() ? CAP.rows.length : distinctModels(ALL);
    return esc(VIEW.length) + (VIEW.length === total ? "" : "/" + esc(total)) +
      (VIEW.length === 1 && total === 1 ? " model " : " models ") + officialBadge(DAY);
  }

  function applyFilter() {
    if (loadState !== "idle") return;
    var q = byId("q").value.trim().toLowerCase();
    var taskMode = MODE === "tasks";
    var insightMode = isInsightMode();
    byId("title").textContent = MODE === "profile" ? "Model profile" : MODE === "history" ? "Release comparison" : "Leaderboard";
    byId("task-explorer").hidden = !taskMode;
    byId("insights").hidden = !insightMode;
    byId("results-scroll").hidden = taskMode || insightMode;
    document.querySelector(".tdb-methods").hidden = taskMode || insightMode;
    byId("measurement-note").hidden = true;
    byId("result-subtitle").hidden = taskMode || insightMode;
    byId("q").placeholder = MODE === "compare" || MODE === "history" ? "Search tasks" : "Search models";
    byId("q").closest("label").hidden = MODE === "profile";
    paintViews();
    paintFacets(q);
    if (insightMode) {
      byId("cap-legend").hidden = true;
      byId("view-note").hidden = true;
      writeUrl(q);
      insights.update({ day: DAY, site: siteData, cap: capData, days: DAYS, rows: ALL, mode: MODE, query: q, agent: facet.agent, effort: facet.effort });
      return;
    }
    if (taskMode) {
      byId("cap-legend").hidden = true;
      byId("view-note").hidden = true;
      taskExplorer.update(DAY, siteData, q);
      writeUrl(q);
      resultsChanged();
      return;
    }
    paintCapNote(DAY, false);
    var rows;
    if (capMode()) {
      COLS = CAP.cols.filter(function (c) { return !c.axis || capAxis === "all" || c.axis.code === capAxis; });
      rows = CAP.rows;
    } else {
      COLS = faColumn(ALL) ? COLS_BASE.concat([COL_FA]) : COLS_BASE.slice();
      var preferred = splitScaffold((DAY.matrix && DAY.matrix.scaffold) || "").agent;
      rows = T.groupModelEfforts(ALL.filter(function (r) { return matchesOther(r, null); }), preferred);
    }
    if (!colByKey(sortKey) || colByKey(sortKey).static) { sortKey = SORT_KEY_DEFAULT; sortDir = SORT_DIR_DEFAULT; }
    VIEW = rows.filter(function (r) {
      return (r.variants || [r]).some(function (v) { return matchesQuery(v, q); });
    });
    byId("count").innerHTML = countHtml(q);
    paintViews();
    paintFacets(q);
    byId("head").innerHTML = headHtml();
    faUnlinked = false;
    byId("body").innerHTML = VIEW.length ? sortRows(VIEW).map(function (r) {
      return capMode() ? renderCap(r) : render(r, false);
    }).join("") : '<tr class="tdb-results-message"><td colspan="' + COLS.length +
      '" class="tdb-empty" role="status">No models match these filters. Change your search or reset the filters.</td></tr>';
    writeUrl(q);
    byId("results-table").setAttribute("data-view", capMode() ? (capAxis === "all" ? "all-capabilities" : "capability") : "overall");
    byId("results-table").setAttribute("data-cap-color", capMode() ? capColor : "");
    var scroll = byId("results-scroll");
    scroll.setAttribute("data-cap-matrix", capMode() && capAxis === "all" ? "true" : "false");
    if (capMode() && capAxis === "all") {
      scroll.setAttribute("tabindex", "0");
      scroll.setAttribute("role", "region");
      scroll.setAttribute("aria-label", "Capability results. Scroll to compare all skills.");
    } else {
      scroll.removeAttribute("tabindex");
      scroll.removeAttribute("role");
      scroll.removeAttribute("aria-label");
    }
    paintCapLegend();
    var note;
    byId("result-subtitle").hidden = !capMode();
    if (capMode()) {
      var config = splitScaffold(CAP.summary.scaffold || "");
      byId("result-subtitle").textContent = T.agentLabel(config.agent || "Published agent") + " / " + (config.effort || "default");
      note = "Each cell shows success rate and task count. Skills may overlap. ";
    } else {
      note = facet.effort ? facet.effort + " effort selected. " : "Each model shows its highest tested effort. ";
      note += "Expand a model to compare settings. ";
    }
    if (!capMode()) note += aggregationDescription(DAY);
    byId("measurement-note").textContent = note;
    byId("measurement-note").hidden = true;
    bindReproduce(DAY);
    renderFoot(DAY);
    resultsChanged();
  }

  /* The reference names the benchmark version in the title -- "terminal-bench@2.1
     Leaderboard" -- and carries no summary cards at all. Ours rotates daily, so
     the day IS the version. Counts that were four cards are one line above the
     table, next to the entry count they belong with. */
  function heading(day) {
    byId("title").textContent = "Leaderboard";
    /* The command has to be one a reader can actually run. This block used to
       print `tdb run --suite <date> -a <agent> -m <model>`, invented by analogy
       with the reference site: `tdb run` takes a positional MODEL and TASK plus
       `--harness`, and none of those three flags exist. It sat behind a copy
       button, which is the worst place on the site to be wrong. The Agent
       column IS the --harness value, so a row maps onto the real command. */
    /* The task-ids link is only a link where the suite page it names exists.
       This pointed at ../benchmarks/<date>/ for whatever day was loaded, and
       docs/data/index.json publishes seven selectable days while the catalogue
       publishes suites for six of them: 2026-07-23 is selectable in the day nav
       and has no suite directory, so the one link next to the reproduce command
       404'd on it. A dead link beside a runnable command is the same failure the
       command block itself was fixed for -- the reader cannot tell a page that
       is missing from a page they mistyped their way out of.

       The guard is the catalogue's `suites`, which is the same source
       reproduce() already consults before it will name an archive task, so the
       two controls in this block cannot come to different conclusions about
       whether this suite is published.

       Absent is SAID, not hidden. Dropping the element would leave a reader who
       knows the link is normally here unable to tell whether the suite is
       unpublished or the page is broken, and the same sentence for both is the
       thing this site refuses everywhere else. So the anchor stays, loses its
       href -- an <a> with no href is not a link and cannot be followed -- and
       names what is missing, in the muted ink the rest of the page uses for
       "there is no measurement here". */
    var t = byId("cmd-tasks");
    if (t) {
      if (suitePublished(siteData, day.date)) {
        t.setAttribute("href", "../benchmarks/" + encodeURIComponent(day.date) + "/");
        t.removeAttribute("aria-disabled");
        t.className = "";
        t.textContent = tasksLabel;
      } else {
        t.removeAttribute("href");
        t.setAttribute("aria-disabled", "true");
        t.className = "text-muted-foreground";
        t.textContent = "No task list is published for this suite";
      }
    }
  }

  /* Whether the catalogue publishes a suite for this day, which is what decides
     whether ../benchmarks/<date>/ exists. A null catalogue -- it could not be
     fetched -- answers no, so the page offers no link rather than one it has no
     evidence for; T.fetchFailed has already said on the page that the catalogue
     could not be read, so the absence is explained rather than mysterious. */
  function suitePublished(site, date) {
    var suites = (site && site.suites) || [];
    for (var i = 0; i < suites.length; i++) {
      if (suites[i] && String(suites[i].id) === String(date)) { return true; }
    }
    return false;
  }

  /* ------------------------------------------------------------------ *
   * The authority gate.
   *
   * "official" is a claim about provenance, not a field a publisher gets to
   * assert. Every condition below is independent and ALL must hold; any one
   * missing, of the wrong type, or absent from the published files leaves the
   * day unofficial. The failure this prevents is a single mis-set boolean
   * turning measured solve rates into a claimed ranking.
   *
   * The conditions come from two files and neither is optional. The publication
   * state -- who approved the bundle, which registry mode it was published
   * under, whether the anti-cheat deployment was live -- is one thing for the
   * whole site and is read from site_data.json's `scoring` block, the same
   * block and the same conjunction the home page reads, so the badge cannot
   * differ between the two pages. What the day itself carries is the v3
   * relative-capability report, and that is read from the day.
   *
   * Where the caveat text went: it is documentation, so it lives in the
   * documentation (guide/quality-methods/). What lives HERE is the code that
   * decides -- a page that explains the gate in a paragraph but does not run
   * it is worse than one that runs it silently.
   * ------------------------------------------------------------------ */
  var ALLOWED_DIMENSIONS = { overall: true, language: true, capability: true };

  /* The v3 relative-capability report, wherever the day file carries it. */
  function relativeReport(day) {
    var candidates = [day, day && day.relative_capability, day && day.relative_scoring];
    for (var i = 0; i < candidates.length; i++) {
      if (candidates[i] && candidates[i].schema_version === "td-relative-capability-v3") {
        return candidates[i];
      }
    }
    return null;
  }

  /* The flag half of the gate: the publication state, plus the three fields of
     the v3 report that say what it was computed over.

     WHERE THE FLAGS ARE READ FROM, AND WHY THAT WAS THE BUG. This read
     `(day && day.scoring) || {}`. No day file has a `scoring` key -- none of
     the seven in docs/data/days/ does -- so every one of the five tests below
     was `undefined === true` and the gate was closed by an accident of shape
     rather than by the state it is supposed to be reading. It happened to
     render the right badge today, because today the real flags are false too;
     the day the operator sets official_ranking this page would still have said
     Unofficial while the home page, which reads the flags from the catalogue,
     said Official. Two pages disagreeing about whether a number is a ranking is
     worse than either answer.

     The publication state lives in site_data.json's `scoring` block, which is
     already loaded into siteData at boot, and that is now the ONE source both
     pages read. Fail-closed is unchanged and load bearing: siteData null (the
     catalogue could not be fetched), the block absent, or any single field
     missing or of the wrong type all leave the day unofficial. */
  function gateFlags(day) {
    var report = relativeReport(day);
    var scoring = (siteData && siteData.scoring) || {};
    var input = (report && report.input) || {};
    return !!report &&
      scoring.official_ranking === true &&
      scoring.publication_registry_mode === "code-controlled-allowlist" &&
      scoring.publication_bundle_approved === true &&
      scoring.relative_report_digest_matches === true &&
      scoring.anti_cheat_deployment_active === true &&
      input.frozen_task_roster_n === 50 &&
      input.task_roster_digest_trusted === true &&
      input.cell_manifest_digest_trusted === true;
  }

  /* A rating is shown as ranked only on a dimension the catalogue authorises
     and only when the rating itself is marked publishable with a real interval.
     Kept live so a v3 document dropped in later cannot bypass it. */
  function publishableRatings(day) {
    var report = relativeReport(day);
    /* gateFlags, not formalAuthority: formalAuthority is a CONSUMER of this
       function, and a gate that called the thing that calls it could not be
       read in either direction. The flag half is the part this needs. */
    if (!gateFlags(day)) return [];
    var rows = [];
    (report.axes || []).forEach(function (axis) {
      if (!axis || !ALLOWED_DIMENSIONS[axis.dimension]) return;
      ["model", "harness", "configuration"].forEach(function (kind) {
        var table = axis.entities && axis.entities[kind];
        ((table && table.ratings) || []).forEach(function (rating) {
          if (rating && rating.publishable === true &&
              typeof rating.relative_score === "number" && Array.isArray(rating.ci)) {
            rows.push({ axis: axis.axis, dimension: axis.dimension,
                        kind: kind, rating: rating });
          }
        });
      });
    });
    return rows;
  }

  /* The whole gate: the flags, and then a rating that may actually be shown.
     The second half is not a formality. Every flag can be set and the report
     can still carry no model rating that survives its own publish test, and a
     day with nothing publishable on it is not a ranking of anything -- the
     catalogue says as much in its own words today (publishable_overall_models
     is 0). The home page has required this since it was written and this page
     did not, which is the second way the two gates could have disagreed while
     both looked correct. The axis is named exactly: axis "overall" on dimension
     "overall", model entities. A rating publishable on some narrower axis is
     not authority to call the whole day's ordering official. */
  function formalAuthority(day) {
    if (!gateFlags(day)) return false;
    var ranked = publishableRatings(day).filter(function (row) {
      return row.axis === "overall" && row.dimension === "overall" &&
        row.kind === "model";
    });
    return ranked.length > 0;
  }

  /* One badge, not a paragraph. */
  function officialBadge(day) {
    return formalAuthority(day)
      ? '<span class="tdb-badge" data-official="true">Official</span>'
      : '<span class="tdb-badge" data-official="false">Preliminary</span>';
  }

  /* ------------------------------------------------------------------ *
   * The reproduce command.
   *
   * This shipped `tdb run <MODEL> tasks/archive/<task-id> --harness <agent>`
   * behind a copy button. Angle brackets are not copy-pasteable, so the one
   * control on the page whose entire job is to hand a reader something they
   * can run handed them something they could not.
   *
   * It is bound to a real row now. The model and harness come from the
   * top-ranked row of the loaded day, which is the row directly under the
   * button. The task is the lexicographically first ARCHIVE task in that
   * day's suite: live tasks withhold gold patches and protected test bodies,
   * so a command naming one cannot be run by the reader it is shown to.
   * ------------------------------------------------------------------ */

  /* The reasoning effort is part of the measurement, not a decoration.
     splitScaffold() already separates `codex@low` into agent + effort, and the
     command spent only the agent -- so the button bound to rank 1 printed the
     command for a DIFFERENT row of the same table: gpt-5.6-sol at the codex
     default, which is a separate line with a separate score. A reader who runs
     the one control on this page whose whole job is to be runnable, and gets a
     number that cannot match the row above it, concludes the leaderboard is
     wrong.

     Only an effort whose CLI spelling is attested in THIS repository is
     expressed. `tdb run` takes `--agent-kwarg KEY=VALUE`, and the codex
     adapter's key is `reasoning_effort` (tests/test_vendor_harness.py builds a
     codex run spec with exactly that kwarg). No other harness publishes an
     effort key here, so no other harness gets one invented for it: an
     unmappable effort yields no command rather than a confident wrong one. Add
     a harness to the map when its kwarg is verified, never when it is guessed.
  */
  var EFFORT_KWARG = { codex: "reasoning_effort" };

  /* {cmd, why}: the reason travels with the refusal, because "no runnable
     command" has three different causes here and the page used to print the
     archive-task one for all of them. */
  function reproduce(day, site, top) {
    var ids = ((site && site.tasks) || []).filter(function (t) {
      return t && t.status === "archive" && T.taskSuites(t).indexOf(day.date) >= 0;
    }).map(function (t) { return t.id; }).sort();
    if (!ids.length) {
      return { cmd: null, why: "No archive task is published for this suite. " };
    }
    if (!top) {
      return { cmd: null, why: "No measured row is published for this day. " };
    }
    var cmd = "tdb run " + top.model + " tasks/archive/" + ids[0] +
      " --harness " + top.agent;
    if (top.effort) {
      var kw = hasOwn(EFFORT_KWARG, top.agent) ? EFFORT_KWARG[top.agent] : null;
      if (!kw) {
        return { cmd: null, why: "The effort kwarg for " + top.agent + " is not " +
          "published here, so no command is shown rather than one that would " +
          "reproduce a different row. " };
      }
      cmd += " --agent-kwarg " + kw + "=" + top.effort;
    }
    return { cmd: cmd, why: "" };
  }

  function bindReproduce(day) {
    var top = sortRows(VIEW)[0];
    if (top && capMode()) { top = Object.assign({}, top, splitScaffold(CAP.summary.scaffold || "")); }
    var bound = reproduce(day, siteData, top);
    var code = byId("cmd"), warn = byId("cmd-warn"), copy = byId("copy");
    if (code) { code.textContent = bound.cmd || cmdPlaceholder; }
    if (warn) { warn.textContent = bound.why; }
    /* Nothing runnable to hand over means nothing to copy. A copy button that
       yields a template is the failure this whole block exists to remove. */
    if (copy) { copy.disabled = !bound.cmd; }
  }

  /* The Wilson half-width at a given rate, recomputed for THIS day's task
     count. It depends on the rate as much as on n, so the one figure the foot
     prints is labelled with the rate it belongs to (50%, the widest); an
     unlabelled figure would overstate a 5% row by half, and a hard-coded one
     would be wrong the first time n changes. */
  function halfWidth(rate, n) {
    if (!n) { return "0"; }
    /* Not Math.round(rate * n): forcing an integer solve count moves the rate
       off the one being illustrated (2/50 is 4%, 3/50 is 6%) and the printed
       figure then swings a whole point on a rounding rule. Wilson only reads
       solved/n, so the exact rate is passed straight through. */
    var w = T.wilson(rate * n, n);
    return (((w.hi - w.lo) / 2) * 100).toFixed(0);
  }

  /* ------------------------------------------------------------------ *
   * The discrimination digest.
   *
   * What the suite separates, decomposed from the solve matrix of THE DAY ON
   * SCREEN and the task catalogue. Every number is recomputed here rather than
   * copied out of the /quality/ report, so regenerating either file UPDATES
   * this digest instead of falsifying it.
   *
   * THIS IS A PER-DAY QUANTITY, and it was being drawn from a global. Read the
   * function: every figure it returns -- the task count, the three bands, the
   * per-cell coverage, the roster size, the scaffold name -- comes out of
   * `board.matrix` and `board.leaderboard`, and it even carries `board.date`
   * out with it because digestHtml has to name the grid it describes. Nothing
   * in it aggregates over days. It was nonetheless called with the fixed
   * 2026-09-10 snapshot on every day, so the paragraph under the 2026-09-03
   * table counted 342 columns for a day whose matrix has 366, and under the
   * three matrix-less days it counted them for a day with no matrix on screen
   * at all. It now takes the day, which means it renders nothing at all on
   * those three days -- a digest that cannot be computed is absent, and the
   * table above it is what tells the reader the day is thin.
   *
   * A cell that was never run is null, not a failure: it is dropped from a
   * task's denominator rather than counted as a zero. A task no model solved
   * and a task every model solved both separate nothing; only the ones in
   * between carry information, and that count over the task count is D.
   * ------------------------------------------------------------------ */
  function discriminationDigest(board, site) {
    var matrix = board && board.matrix;
    var rows = matrix && matrix.rows;
    var ids = matrix && matrix.tasks;
    if (!rows || !rows.length || !ids || !ids.length) { return null; }
    var status = {};
    ((site && site.tasks) || []).forEach(function (t) {
      if (t && t.id) { status[t.id] = t.status || "unrecorded"; }
    });
    /* `scaffold` and `models` are what makes the sentence below true. This
       grid is ONE scaffold's roster; the table above the digest is the whole
       day. Both have to be in the returned object, because digestHtml cannot
       see this function's locals. */
    var out = { n: ids.length, disc: 0, floor: 0, ceiling: 0, unmeasured: 0,
                date: board.date, scaffold: matrix.scaffold || null,
                models: rows.length, modes: {}, order: [] };
    var seen = 0;
    ids.forEach(function (id, j) {
      var k = 0, m = 0;
      rows.forEach(function (row) {
        var cell = (row && row.g) ? row.g[j] : null;
        if (cell === null || cell === undefined) { return; }
        m += 1;
        if (cell) { k += 1; }
      });
      seen += m;
      var band = !m ? "unmeasured" : (!k ? "floor" : (k === m ? "ceiling" : "disc"));
      out[band] += 1;
      /* A task no run touched belongs to no band and to no denominator. It is
         carried as `unmeasured` and named separately, never folded into a mode
         bucket where it would read as a task this scaffold failed. */
      if (band === "unmeasured") { return; }
      var mode = status[id] || "unrecorded";
      if (!out.modes[mode]) { out.modes[mode] = { disc: 0, n: 0 }; out.order.push(mode); }
      out.modes[mode].n += 1;
      if (band === "disc") { out.modes[mode].disc += 1; }
    });
    out.order.sort();

    /* Per-cell coverage, computed the way /quality/ computes it so the two
       pages cannot disagree. `unmeasured` above counts whole COLUMNS with no
       observation; it says nothing about a grid whose columns are all present
       and 15 of whose cells were never executed and ship as zeros. Without
       this, the leaderboard reprinted the floor count as a floor when it is a
       ceiling.

       Which source is authoritative depends on the artifact. Once the matrix
       ships nulls its own non-null count IS the attempt count and the
       per-model `n` sum must not be used, or the two double-count. Today's
       matrix has no nulls, so the roster-restricted `n` sum is the only thing
       that knows 15 cells are missing. */
    var grid = rows.length * ids.length;
    var inRoster = {};
    rows.forEach(function (r) { if (r && r.model) { inRoster[r.model] = 1; } });
    var scaffold = String(matrix.scaffold || "");
    var reported = 0;
    ((board && board.leaderboard) || []).forEach(function (e) {
      var cell = (e && hasOwn(inRoster, e.model)) ? e[scaffold] : null;
      if (cell && typeof cell.n === "number") { reported += cell.n; }
    });
    out.grid = grid;
    out.attempted = (grid - seen) > 0 ? seen : (reported || grid);
    out.unrun = Math.max(0, grid - out.attempted);
    return out;
  }

  /* The report link that used to close this block now sits in the definition
     list above it, so the digest is one paragraph and the standing links are
     all in one place. Nothing that could not be computed is printed: with no
     digest this returns nothing at all rather than a lone "full report" line
     hinting at a number the page could not produce. */
  function digestHtml(d) {
    if (!d) { return ""; }
    var disc = d.disc, floor = d.floor, ceiling = d.ceiling;
    /* The denominator is the tasks this scaffold actually ran, not every column
       in the grid. Where a task was never attempted it is named on its own
       line; counting it as a task nobody solved would turn a gap in coverage
       into a finding about the models. */
    var measured = d.n - d.unmeasured;
    var dval = measured ? (disc / measured).toFixed(2) : "0";
    var ceilTxt = (ceiling === 0) ? "none" : String(ceiling);
    /* Never "this suite". That phrase means the whole day -- every model under
       every scaffold -- while this grid is a SINGLE scaffold's roster. Stated
       unqualified, the sentence was refutable by a row on the same screen: a
       codex row solving more of these tasks than the claim said any model had
       solved. Naming the roster size and the grid inside the sentence is what
       makes the number true, so the follow-up paragraph that used to repeat the
       scope is gone but the scope itself is not. */
    var nm = d.models;
    var who = esc(nm) + " model" + (nm === 1 ? "" : "s");
    var scope = d.scaffold
      ? "the " + esc(d.scaffold) + " grid"
      : "this solve matrix";
    /* The 15 unrun cells, disclosed where the number is printed rather than
       only on /quality/. They ship as zeros, so a task can be counted as
       solved-by-none on the strength of a run that never happened: the floor
       count is an upper bound, and saying so is the whole fix. D itself is NOT
       recomputed here -- it is the published metric and must keep matching
       /quality/. */
    var un = d.unrun || 0;
    var cover = un
      ? " " + esc(un) + " of the " + esc(d.grid) + " cells never ran and ship " +
        "as zeros, so solved-by-none is an upper bound."
      : "";
    var gap = d.unmeasured
      ? " " + esc(d.unmeasured) + " of " + esc(d.n) + " tasks never ran and " +
        "are left out."
      : "";
    /* Modes are only worth splitting when the catalogue named more than one.
       With a single mode there is no difference to attribute, and with none the
       catalogue could not be read at all. */
    var known = d.order.filter(function (mode) { return mode !== "unrecorded"; });
    var split = "";
    if (known.length) {
      var counts = d.order.map(function (mode) {
        return esc(mode) + " " + esc(d.modes[mode].disc) + "/" + esc(d.modes[mode].n);
      }).join(", ");
      var clause = (known.length > 1)
        ? " &mdash; what is withheld differs, not difficulty."
        : ".";
      /* Name the convention. /quality/ prints an identically formatted
         "archive 12/28" meaning (discriminating + ceiling) over in-matrix
         tasks; this one is discriminating over measured. They agree only while
         no task is solved by every model, and a reader comparing the two pages
         has no way to see which is which. */
      split = "<p>By publication mode (discriminating/measured): " +
        counts + clause + "</p>";
    }
    return "<p><strong>Discrimination.</strong> " + esc(disc) + " of " + esc(measured) +
      " tasks separated any of the " + who + " on " + scope +
      " (D " + dval + "); " + esc(floor) + " solved by none, " + ceilTxt +
      " by all." + gap + cover + "</p>" + split;
  }

  /* ------------------------------------------------------------------ *
   * THE CAPABILITY VIEW -- the same table, one axis at a time.
   *
   * The site publishes fourteen capability axes and a solve matrix, and until
   * now nothing joined them: a reader could see WHICH tasks carry an axis and
   * WHICH models solved which tasks, and had to do the join by hand. This does
   * it -- rows are models, columns are axes, a cell is that model's solve rate
   * on the tasks carrying that axis.
   *
   * IT IS A SECOND VIEW OF ONE TABLE, NOT A SECOND TABLE. Same <table>, same
   * search box, same sort, same foot. A ranking belongs on the leaderboard,
   * and a page that grows a parallel component every time a question is asked
   * of it stops being an instrument.
   *
   * WHAT THE JOIN ACTUALLY SUPPORTS, which is most of what this view is for.
   * Two axes carry nearly every labelled task, so ordering models on them
   * reproduces the overall column instead of splitting it. Every other axis
   * that carries anything carries a fraction of the grid, where the 95%
   * interval is wide relative to the spread between first place and last. And
   * an axis can still carry nothing at all. A view that showed only the rates
   * would look like fourteen findings; what is true is two restatements, some
   * partial views and at least one gap, and the cells have to SAY that rather
   * than leave it to a footnote. Every one of those shapes is counted from the
   * join at render time, never written down here, so this paragraph describes
   * the mechanism and the foot describes the day.
   *
   * AND ALMOST NONE OF THESE LABELS WERE RE-DERIVED. See capabilityAxes(): the
   * columns are the union of the catalogue's re-derived list and its
   * declared-but-unchecked list, because on a live board the first is nearly
   * empty -- four columns on C4, four on C5, one on C6, nothing anywhere else.
   * A rate computed over declared labels is a real measurement of the models
   * over a task set the site did not verify the membership of, which is a
   * weaker object than the one this view used to promise, and the difference
   * has to be on screen and not in a commit message.
   *
   * So four refusals, in the cells and in the controls:
   *
   *   * NO RATE WITHOUT ITS DENOMINATOR. Every cell that has a measurement
   *     prints solved/n beside it. A rate whose n a reader cannot see is the
   *     precise failure this view exists to expose, so it is not reachable
   *     from here: one function produces both halves or produces neither.
   *
   *   * NO RANK BELOW THE PUBLISHED FLOOR. capability.json ships its own
   *     publish gate, min_tasks. An axis under it shows observed accuracy and
   *     sample size, and its header is inert -- the table cannot be sorted by a
   *     column whose data cannot order it. That is the mechanism chosen over
   *     greying the cell or printing an interval inside it: grey is a
   *     decoration a reader can ignore, and a control that still works while
   *     the page says not to trust it is an invitation. The floor is READ from
   *     the file, never chosen here; a file publishing none leaves every axis
   *     unranked, which is the fail-closed direction.
   *
   *   * Every axis remains available in the selector and in the all-columns
   *     view. An axis with no measured task shows an em dash, never zero.
   *
   *   * NO RATE WITHOUT ITS PROVENANCE. This is the same refusal as the first
   *     one, applied to the other half of the denominator: a reader who cannot
   *     see WHICH tasks a rate was taken over cannot read it, and "the tasks
   *     the catalogue re-derived this label for" and "the tasks that claim this
   *     label about themselves" are not the same set. So provenance is printed
   *     in both places, for the two different things they can each say. The
   *     column head carries the exact split -- how many of the column's tasks
   *     were re-derived and how many are declared -- because that split is a
   *     property of the COLUMN, the same argument that puts the interval there
   *     rather than in fourteen copies down the column. And the cell carries
   *     the word "declared" beside its counts whenever ANY task in the column
   *     came from the declared list, because the cell is what gets read on a
   *     narrow screen with the head scrolled off, screenshotted, and quoted.
   *     The cell does not attempt the split: it fails closed, saying declared
   *     for a column that is four parts checked and 313 parts claimed, since
   *     an unchecked task in the denominator taints the rate whatever its
   *     share. `data-provenance` on the cell says the same thing to a scraper.
   *     What the site will NOT do is print the catalogue's coverage_share
   *     beside any of this: that field is computed over the 38 verifiable
   *     packages -- C5 reads 1.000 there -- and describes a corpus that is not
   *     the grid on screen. Any share this view shows is recomputed from the
   *     join under it or is not shown.
   *
   * And nowhere in here is a null turned into a zero. A matrix cell is 1, 0 or
   * null; a null is skipped out of the numerator AND the denominator, and a
   * model with no measured cell on an axis gets an em dash, never 0%.
   * ------------------------------------------------------------------ */
  var CAP = null;

  /* One model's tally over a set of matrix columns. The two counters move
     together or not at all: a cell that was never run leaves both alone, so
     `n` is what was measured and never what was scheduled. */
  function axisTally(row, cols, declaredRuns) {
    var k = 0, n = 0, g = null;
    for (var i = 0; i < cols.length; i++) {
      g = (row && row.g) ? row.g[cols[i]] : null;
      if (g === null || g === undefined) { continue; }
      n += 1;
      if (g) { k += 1; }
    }
    var repeat = T.repeatStats(row, cols);
    if (repeat && declaredRuns != null && repeat.runs !== declaredRuns) repeat = null;
    return repeat ? { solved: k, n: n, repeat: repeat } : { solved: k, n: n };
  }

  /* The widest 95% Wilson half-width a column of this length can produce, in
     points. Taken at p = 0.5 because that is the maximum: quoting it at the
     observed rate would make a column look sharper than the next model's rate
     can be resolved to. */
  function resolution(n) {
    if (!n) { return null; }
    var w = T.wilson(n / 2, n);
    if (!w || typeof w.lo !== "number" || !isFinite(w.lo)) { return null; }
    return ((w.hi - w.lo) / 2) * 100;
  }

  /* Every axis the catalogue publishes, joined to this matrix's roster --
     including the ones the join leaves empty. `.map` and never `.filter`:
     dropping an empty axis here is the one bug this view cannot survive.

     THE JOIN IS OVER TWO TASK LISTS, NOT ONE, AND THAT IS WHY THIS VIEW HAS
     ANYTHING IN IT. `a.task_ids` is the catalogue's re-derived list: labels the
     generator recomputed from the package's own oracle patch and protected test
     diff and asserted against both stored copies. Only 38 of the 459 packages
     ship those inputs, so on the 2026-09-10 board -- 342 live tasks -- that
