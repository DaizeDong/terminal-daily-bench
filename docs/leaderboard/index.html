    out.sort(function (a, b) {
      var pa = overallPoint(a), pb = overallPoint(b);
      if (pa === null || pb === null) { return (pa === null) ? 1 : -1; }
      return pb - pa;
    });
    /* Rank is over the OVERALL column and travels with the row, exactly as on
       the main table, so sorting by an axis and coming back is possible. A
       model with nothing measured has no rank rather than the last one. */
    var last = false, lastRank = 0;
    out.forEach(function (r, i) {
      var p = overallPoint(r);
      if (p === null) { r.rank = null; return; }
      if (last === false || p !== last) { lastRank = i + 1; last = p; }
      r.rank = lastRank;
    });
    return out;
  }

  function overallPoint(r) {
    return (r && r.overall && r.overall.n) ? (r.overall.solved / r.overall.n) : null;
  }

  /* Whether a column's task set is fully re-derived, and the word the cell
     prints if it is not. A single declared task is enough to make the answer
     "declared": the reader is being told what the WEAKEST evidence in the
     denominator is, not the average of it, and an axis whose nDeclared the
     join left at zero says nothing rather than saying "re-derived" -- a badge
     of quality is not this function's job, only the warning is. The overall
     column and any caller passing a bare {ranked:true} axis therefore fall
     through to "" with no property access that could throw. */
  function provenanceWord(axis) {
    return (axis && axis.nDeclared) ? "declared" : "";
  }

  /* An axis cell. Three outcomes and no fourth, and only the third prints a
     percentage. The provenance word rides in the same span as the counts and
     is produced by the same call that produces them, for the reason the counts
     themselves are: a rate that can be lifted out of this function without its
     denominator or without its provenance is the failure the view exists to
     expose, so there is no code path here that emits one alone. */
  function capCell(t, axis) {
    if (!t || !t.n) {
      return '<span class="text-muted-foreground">&mdash;</span>';
    }
    var word = provenanceWord(axis);
    var counts = esc(t.solved) + "/" + esc(t.n) + (word ? " " + word : "");
    /* The machine-readable attribute is read off the axis's OWN provenance
       counts, not off whether the human-readable word came back empty. It
       used to be `word ? "declared" : "rederived"`, which asserted
       re-derivation for every cell that simply had nothing to warn about --
       and the worst case was the whole Overall column, which is drawn through
       this function with OVERALL_AXIS, an axis carrying neither nDeclared nor
       nVerified because it is not built from capability labels at all. Every
       Overall cell therefore shipped data-provenance="rederived" while, on
       2026-09-10, only 4 of the 342 tasks under it carry a re-derived label
       (5 of 366 on 2026-09-03, 4 of 338 on 2026-09-04 and on 2026-09-05, and
       the other three published days have no matrix and so no capability view
       at all). An absent provenance is now absent: no attribute is emitted,
       because a scraper reading one is entitled to have it mean something,
       and "I was not told" must not be spelled the same way as "checked". */
    var prov = "";
    if (axis && axis.nDeclared) { prov = ' data-provenance="declared"'; }
    else if (axis && axis.nVerified) { prov = ' data-provenance="rederived"'; }
    if (!axis || !axis.ranked) {
      return '<p class="tdb-cap-cell" data-ranked="false"' + prov + '>' +
        '<span class="tdb-cap-n">' + counts + "</span></p>";
    }
    var w = pointEstimate(t);
    if (w === null) {
      return '<span class="text-muted-foreground">&mdash;</span>';
    }
    var rate = T.pct(w.p);
    return '<p class="tdb-cap-cell" data-ranked="true"' + prov + '>' +
      '<strong class="tabular-nums">' + rate + "</strong>" +
      '<span class="tdb-cap-n">' + counts + "</span></p>";
  }

  /* The column head's second line. Not a sentence -- a reading: what this
     column is measured on, where those labels came from, how wide the
     measurement is, and whether it is allowed to order the table.

     The provenance term is the exact split and not the cell's one word,
     because this is the only place on screen with room to say "4 re-derived,
     313 declared" -- and that ratio is the difference between a column the
     catalogue checked and a column that describes itself. A column with no
     declared task says nothing extra; the note is a warning, and a column
     that has earned no warning does not need a certificate. An axis carrying
     nothing has no provenance to state, so "no task" is still the whole
     line. */
  function axisNoteHtml(a) {
    if (!a.n) { return "no task"; }
    var tasks = esc(a.n) + " task" + (a.n === 1 ? "" : "s");
    var band = (a.half === null) ? "" : " &plusmn;" + a.half.toFixed(0) + "%";
    var prov = "";
    if (a.nDeclared) {
      prov = a.nVerified
        ? " &middot; " + esc(a.nVerified) + " re-derived, " +
          esc(a.nDeclared) + " declared"
        : " &middot; all declared";
    }
    var verdict = a.ranked ? "" : " &middot; unranked";
    return tasks + band + prov + verdict;
  }

  function capColumns(axes, nTasks) {
    var cols = [
      { key: "rank", label: "Rank", right: true, dir: "asc",
        value: function (r) { return r.rank; } },
      { key: "model", label: "Model", dir: "asc",
        value: function (r) { return r.model; } },
      { key: "overall", label: "Overall", right: true, dir: "desc",
        noteHtml: axisNoteHtml({ n: nTasks, half: resolution(nTasks), ranked: true }),
        value: overallPoint }
    ];
    axes.forEach(function (a) {
      cols.push({
        key: "cap:" + a.code,
        label: a.code + " " + a.name,
        right: true, dir: "desc", axis: a,
        static: !a.ranked,
        noteHtml: axisNoteHtml(a),
        /* An unranked axis reads as blank in both directions, which is what
           sortRows already does with "never measured" -- so even a stale sort
           key arriving in the URL cannot produce an order. */
        value: function (r) {
          if (!a.ranked) { return null; }
          var t = r.axis[a.code];
          return (t && t.n) ? (t.solved / t.n) : null;
        }
      });
    });
    return cols;
  }

  /* The overall column is always rankable: it is the column the rank is
     assigned from. Named rather than written inline so capCell() takes the
     same shape of argument from both of its call sites. */
  var OVERALL_AXIS = { code: "overall", name: "overall", ranked: true };

  function rankCell(r) {
    return (r.rank === null || r.rank === undefined)
      ? '<span class="text-muted-foreground">&mdash;</span>'
      : esc(r.rank);
  }

  /* The overall column is drawn with the SAME cell as every axis, bar and all
     -- meaning no bar. Two reasons, and the second is the important one.

     It fits: the score bar is a 5rem track plus a 3.5rem number, and spending
     nearly nine of a seventeen-column table's rems on the one column that is
     already legible pushes four axes off the right edge on a 1440px screen.

     And it compares. The whole claim this view makes about itself is that the
     C4 and C5 columns ARE the overall column with a different heading. A
     reader can only see that by reading the three columns against each other,
     and three columns are only comparable when they are drawn the same way.
     The interval the bar's neighbour used to carry has not been dropped: it is
     in the column head, where it applies to the column rather than to one
     cell. */
  function renderCap(r) {
    /* Built before the markup expression rather than inside it, for the same
       reason accuracyCell() builds its bar first: the repository's escaping
       scan reads every concatenation that produces a '<' and reports any
       property access it cannot see run through a safe formatter. `r.overall`
       is a validated tally and OVERALL_AXIS is a constant, but a scanner that
       took the author's word for either would protect nothing. */
    var overall = capCell(r.overall, OVERALL_AXIS);
    var out = '<tr data-slot="table-row" class="' + TR + '">' +
      cell(" text-right tabular-nums text-muted-foreground", rankCell(r)) +
      cell(" font-medium", esc(r.model)) +
      cell(" text-right", overall);
    CAP.axes.forEach(function (a) {
      out += cell(" text-right", capCell(r.axis[a.code], a));
    });
    return out + "</tr>";
  }

  /* Everything the foot has to be able to say, counted from the join rather
     than written down. A number typed into a sentence stops being true the
     first time either input file is regenerated. */
  function capabilitySummary(board, axes, site) {
    var matrix = board && board.matrix;
    var ids = (matrix && matrix.tasks) || [];
    var labelled = {}, carriers = [], gestures = 0, empty = 0;
    /* Two task sets, counted apart for the same reason the axis keeps two
       counts: `labelled` is every task the view drew a column over, `derived`
       is the subset whose label the catalogue actually re-derived. The
       difference between the two sizes is the whole caveat this view carries,
       and it is counted here so the foot cannot quote a stale one. cols is
       built verified-first by capabilityAxes(), so the first nVerified entries
       are exactly the re-derived ones. */
    var derived = {};
    axes.forEach(function (a) {
      a.cols.forEach(function (j, k) {
        labelled[ids[j]] = 1;
        if (k < a.nVerified) { derived[ids[j]] = 1; }
      });
    });
    var nLabelled = Object.keys(labelled).length;
    var nDerived = Object.keys(derived).length;
    var axesDeclared = 0;
    axes.forEach(function (a) { if (a.nDeclared) { axesDeclared += 1; } });
    axes.forEach(function (a) {
      if (!a.n) { empty += 1; return; }
      /* A "carrier" is an axis covering four fifths or more of everything that
         carries any label: at that share its column is the overall column with
         a different heading, and saying so IS the finding. */
      if (nLabelled && a.n >= nLabelled * 0.8) { carriers.push(a); }
      else if (a.n > gestures) { gestures = a.n; }
    });
    /* Why the unlabelled tasks are unlabelled, taken from the catalogue's own
       status field rather than assumed. */
    var status = {};
    ((site && site.tasks) || []).forEach(function (t) {
      if (t && t.id) { status[t.id] = t.status || "unrecorded"; }
    });
    var unlabelled = 0, unlabelledLive = 0;
    ids.forEach(function (id) {
      if (hasOwn(labelled, id)) { return; }
      unlabelled += 1;
      if (status[id] === "live") { unlabelledLive += 1; }
    });
    return {
      nTasks: ids.length, nLabelled: nLabelled, nDerived: nDerived,
      axesDeclared: axesDeclared, nAxes: axes.length,
      unlabelled: unlabelled,
      unlabelledLive: unlabelledLive, carriers: carriers,
      gestures: gestures, empty: empty,
      models: ((matrix && matrix.rows) || []).length,
      scaffold: (matrix && matrix.scaffold) || null,
      date: (board && board.date) || null
    };
  }

  function buildCapability(board, cap, site) {
    var axes = capabilityAxes(board, cap);
    if (!axes) { return null; }
    var rows = capabilityRows(board, axes);
    if (!rows) { return null; }
    var gate = (cap && cap.publish_gate) || {};
    return {
      axes: axes,
      rows: rows,
      cols: capColumns(axes, ((board.matrix && board.matrix.tasks) || []).length),
      floor: (typeof gate.min_tasks === "number" && isFinite(gate.min_tasks))
        ? gate.min_tasks : null,
      summary: capabilitySummary(board, axes, site)
    };
  }

  /* The capability foot. It carries its OWN scope warning rather than
     inheriting the main table's: the grid under it is one scaffold and twelve
     models, the table it replaced is every model measured on the day under
     every configuration, and the two are one click apart. A reader who takes
     an axis column for a slice of the 152-row board has been misled by the
     control, not by the data. */
  function capFootHtml(day) {
    if (!CAP) { return ""; }
    var d = CAP.summary;
    var scaffold = d.scaffold ? esc(d.scaffold) : "one scaffold";
    var names = d.carriers.map(function (a) {
      return esc(a.code) + " " + esc(a.name) + " carries " + esc(a.n);
    }).join(" and ");
    var floorTxt = (CAP.floor === null)
      ? "The catalogue publishes no task floor, so no axis is ranked here."
      : "An axis is ranked only where it carries at least " + esc(CAP.floor) +
        " of this grid's tasks, which is the catalogue's own publish gate. " +
        "Below it a cell shows counts and no rate, and the column head is " +
        "inert: an order the data cannot support is refused rather than " +
        "footnoted.";
    var nScaf = Object.keys(day.pooled || {}).length;
    /* The second half of this sentence describes the OTHER view, one click
       away, so it is counted from that view's rows for the same reason
       countHtml is: a reader can switch back and count the models. The day
       file's n_models stood here and disagreed with the table it named. */
    var scopeTxt = "Rates are for " + esc(d.models) + " models under " + scaffold +
      " on " + esc(d.date) + ", over " + esc(d.nTasks) + " tasks. The overall " +
      "view ranks " + esc(distinctModels(ALL)) + " models across " + esc(nScaf) +
      " agent and effort configurations; the two are different measurements, " +
      "and a cell here cannot be read against a row there.";
    /* Both fractions are recomputed from the join drawn above -- the labelled
       share AND the re-derived share. The catalogue publishes a coverage_share
       per axis, but it is taken over the 38 packages that ship an oracle patch
       (C5 reads 1.000 there), so it describes a corpus of 38 and not the grid
       of this size on screen. Printing it here would be a rate borrowed from
       another denominator, which is the one thing this page refuses hardest. */
    /* The remainder clause, counted three ways because the remainder is not
       always plural and is not always non-empty. It read "All " + n + " of
       the rest are live" for every day where the unlabelled tasks are all
       live, and on 2026-09-03 exactly one task in the grid is unlabelled, so
       the site published "All 1 of the rest are live" -- a foot that cannot
       count to one, sitting above 326 counts a reader is being asked to
       trust. Checked across every day that HAS a capability view: the
       unlabelled remainder is 1 on 2026-09-03, 15 on 2026-09-04 and
       2026-09-05, 16 on 2026-09-10, and on all four every unlabelled task is
       live; 2026-07-23, 2026-08-19 and 2026-09-06 publish no matrix, so this
       foot never renders on them. The empty case has not been seen on any
       published day, but it is written out anyway rather than left to print
       "All 0 of the rest are live, and none of the unlabelled tasks names a
       capability code" -- two clauses about a set with no members. The
       not-all-live branch stays for the same reason: it is reachable the day
       a task in the grid stops being live, and it must not need a rewrite to
       be correct when it first renders. */
    var restTxt;
    if (!d.unlabelled) {
      restTxt = "Every task in this grid carries a label, so there is no " +
        "unlabelled remainder to account for. ";
    } else {
      restTxt = ((d.unlabelled === 1)
        ? ((d.unlabelledLive === 1)
            ? "The one remaining task is live, and it does not name"
            : "The one remaining task is not live, and it does not name")
        : ((d.unlabelled === d.unlabelledLive)
            ? "All " + esc(d.unlabelled) + " of the rest are live, and none " +
              "of the unlabelled tasks names"
            : esc(d.unlabelledLive) + " of the other " + esc(d.unlabelled) +
              " are live, and none of the unlabelled tasks names")) +
        " a capability code in its task.toml, so nothing places " +
        ((d.unlabelled === 1) ? "it" : "them") +
        " on an axis by either route -- not a withheld measurement but an " +
        "absent declaration. ";
    }
    var coverTxt = esc(d.nLabelled) + " of " + esc(d.nTasks) +
      " tasks in this grid carry a capability label, and " + esc(d.nDerived) +
      " of those " + esc(d.nLabelled) + " had that label re-derived from the " +
      "package. " + restTxt +
      "The shares here are counted from the join in " +
      "this table; the catalogue's own coverage_share is measured over the " +
      "packages that ship an oracle patch and does not describe this grid.";
    /* The provenance term is reader-facing copy and deliberately says the
       uncomfortable half first. It names the mechanism -- the tagger's only
       inputs are the oracle patch and the protected test diff, and a live
       package ships neither -- because "declared" without the reason reads as
       sloppiness rather than as the deliberate withholding that it is. */
    var provTxt = esc(d.axesDeclared) + " of the " + esc(d.nAxes) +
      " axes are built partly or wholly from labels DECLARED by the task " +
      "package -- the axis code sits in its task.toml keywords -- and never " +
      "re-derived by this site. Only " +
      esc(d.nDerived) + " of the " + esc(d.nTasks) + " tasks in this grid " +
      "could be checked: the tagger reads a package's oracle patch and " +
      "protected test diff, a live package withholds both, and the catalogue " +
      "publishes a re-derived label only where it could recompute one and " +
      "match it against both stored copies. Every cell over a column with any " +
      "declared task is marked <em>declared</em> beside its counts, and each " +
      "column head gives the split. A declared label is a claim by the task, " +
      "not a measurement by the benchmark; the solve counts either side of it " +
      "are measured either way.";
    /* The empty-axis sentence is conditional now because the join can leave
       none: with the declared labels folded in, thirteen of the fourteen axes
       carry something on this board and "The remaining 0 axes carry no task at
       all" is a sentence about nothing. The clause is also singular-safe -- it
       used to be able to print "1 axes", and a foot that cannot count to one
       is not a foot a reader should believe about 342. The refusal it
       describes is unchanged: the empty axis is still drawn, still an em dash,
       still not dropped. */
    var emptyTxt = d.empty
      ? " The remaining " + esc(d.empty) + " " +
        (d.empty === 1 ? "axis carries" : "axes carry") + " no task at all " +
        "and " + (d.empty === 1 ? "is" : "are") + " drawn as an em dash " +
        "rather than dropped, because an axis missing from a table reads as " +
        "an axis that does not exist."
      : " Every axis the catalogue publishes carries at least one task in " +
        "this grid, and an axis that carried none would still be drawn, as " +
        "an em dash rather than dropped.";
    var spread = names
      ? "<p><strong>What the axes separate.</strong> Of the " +
        esc(d.nLabelled) + " labelled tasks in this grid, " + names +
        ", so those columns reproduce the overall ranking rather than " +
        "splitting it. Every other axis that " +
        "carries anything carries " + esc(d.gestures) + " tasks or fewer, " +
        "and has to be read at the interval its own column head quotes " +
        "rather than at the precision its digits suggest." + emptyTxt + "</p>"
      : "";
    var angles = "<p><strong>The angles that are not here.</strong> " +
      "<code>capability_profile()</code> decomposes a model into four " +
      "conditional rates: builds the environment, starts the fix given a " +
      "build, completes the fix given a start, and completes it without " +
      "breaking an already-passing test. Those four are the truest " +
      "multi-angle reading this benchmark has, and none of them can be " +
      "computed from anything published here. They read graded gate states " +
      "0&ndash;4, and every cell shipped in the matrix is 1, 0 or null.</p>";
    return '<dl class="tdb-limits">' +
        "<dt>Cells</dt><dd>A model's solve rate over the tasks carrying that " +
          "axis, with solved/n beside it, and the word <em>declared</em> where " +
          "the label placing those tasks on the axis was not re-derived. An " +
          "axis with no measured task is an em dash, never a zero.</dd>" +
        "<dt>Provenance</dt><dd>" + provTxt + "</dd>" +
        "<dt>Ranking floor</dt><dd>" + floorTxt + "</dd>" +
        "<dt>Resolution</dt><dd>Each column head carries the widest 95% Wilson " +
          "half-width its task count admits, so a column is read at the " +
          "precision it has rather than the precision its digits suggest.</dd>" +
        "<dt>Coverage</dt><dd>" + coverTxt + "</dd>" +
        "<dt>Scope</dt><dd>" + scopeTxt + "</dd>" +
        "<dt>Report</dt><dd>" + LINK_QUALITY + "</dd>" +
      "</dl>" + spread + angles;
  }

  /* Where the numbers came from, who produced them, how to add to them, and
     what the interval beside every rate actually means.

     The CI definition used to run four sentences: a worked table of half-widths
     at 5 / 30 / 50 percent, plus a closing note that rows scored on overlapping
     subsets make two independent intervals indicative rather than exact. Both
     are true and neither changes what a reader does with the number, so the
     definition is one parenthetical now. The half-width is still COMPUTED for
     this day's task count rather than quoted, because it moves with n.

     The closing "Displaying N of M available entries" is gone. It restated,
     three screens lower, the "Showing N of M entries" that sits directly above
     the table -- and being a second copy it needed its own live patch on every
     keystroke, which is a whole mechanism existing to keep a duplicate true.
     The line above the table is the one a reader filtering the table is
     looking at. */
  /* The column is gone; the state it reported is not. An em dash in that
     column meant UNMEASURED, never zero, and a reader who never sees the
     column has to be told the field exists and was not measured -- otherwise
     dropping 354 dashes silently promotes "we do not know" to "we never
     mentioned it". The count is interpolated so the sentence cannot outlive
     the day it describes, and the moment any cell publishes a number the
     column comes back and this term describes the evidence links instead. */
  function faTerm(nRows) {
    if (colByKey("fa")) {
      return "<dt>False accepts</dt><dd>" + (faUnlinked
        ? "Unlinked counts have no published evidence record."
        : "Every non-zero count links the record that produced it.") + "</dd>";
    }
    return "<dt>False accepts</dt><dd>Semantic false-accept is unmeasured: no " +
      "trial has been run for any of the " + esc(nRows) + " published rows, so " +
      "the column is omitted rather than drawn as " + esc(nRows) +
      " em dashes. Each task page reports the same field, also unmeasured.</dd>";
  }

  function renderFoot(day) {
    if (capMode()) {
      byId("foot").innerHTML = capFootHtml(day);
      return;
    }
    var faNote = faTerm(ALL.length);
    var defCells = DEF_CELLS, defOutcomes = DEF_OUTCOMES, defReport = LINK_QUALITY;
    /* `day`, not the global snapshot. The digest describes one solve matrix,
       and the matrix a reader is entitled to read under this header is the one
       in the file the day picker just loaded. On a day that publishes no
       matrix discriminationDigest returns null and digestHtml returns the
       empty string, so the paragraph is absent rather than borrowed. */
    var digest = digestHtml(discriminationDigest(day, siteData));
    /* Both counted from ALL -- the rows this page drew -- and not from the day
       file's n_cells / n_models headline fields; see distinctModels() above for
       what those two fields claimed on 2026-09-10 and what the table under them
       actually held. `tasks` is still the day's own n_tasks, which is NOT the
       size of the suite: it is the primary scaffold's reduced grid, and the
       suite roster is `day.suite.n_tasks`. See boardTaskScope() above for
       where each of the two comes from and for the four days on which they
       disagree or cannot be compared; the phrase printed here is built there
       so that this page and /benchmarks/<date>/ cannot show two different
       numbers that both read as "tasks". */
    var cells = esc(totalAttempts(ALL));
    var models = esc(distinctModels(ALL)), tasks = boardTaskScope(day);
    /* The attempt count is a sum over (model x scaffold x task). Describing it as
       "across <models> models on <tasks> tasks" claimed 16387 attempts over a
       152 x 50 grid that has 7600 intersections -- an impossible decomposition
       printed inside the block that invites the reader to check the
       arithmetic. The missing factor is the scaffold, and the count of
       scaffolds is whatever `pooled` turns out to carry. `across N
       configurations` is descriptive, not multiplicative: coverage is
       deliberately ragged, so it asserts no ceiling. An empty pooled map is
       legitimate (build_day_data writes `pooled: board.get("pooled") or {}`),
       and there the pre-change wording -- which was not wrong -- stands. */
    var nScaf = Object.keys(day.pooled || {}).length;
    var span = nScaf
      ? cells + " model &times; scaffold &times; task attempts: " + models +
        " models, " + esc(nScaf) + " agent/effort configuration" +
        (nScaf === 1 ? "" : "s") + ", " + tasks
      : cells + " model &times; task attempts: " + models + " models, " + tasks;
    /* One sentence saying which of the three cases boardTaskScope() found, so
       a reader holding this page next to /benchmarks/<date>/ is told why the
       two totals differ instead of discovering it. Computed per day: the day
       on screen decides which sentence is true, and a day whose suite record
       publishes no roster size gets the sentence that says so rather than a
       comparison invented out of the board figure. */
    var suiteN = suiteTaskCount(day);
    var scopeNote = (suiteN === null)
      ? "A board task is one the day's primary scaffold ran. This day's " +
        "catalogue record publishes no roster size, so there is no suite " +
        "total to set beside it here."
      : (suiteN === day.n_tasks)
        ? "A board task is one the day's primary scaffold ran, and on this " +
          "day that is every task in the published suite, so the total on " +
          "the suite page is the same number."
        : "A board task is one the day's primary scaffold ran; the suite " +
          "page counts the published roster instead, which is why it says " +
          esc(suiteN) + " where this line says " + esc(day.n_tasks) + ".";
    var h50 = halfWidth(0.5, day.n_tasks);
    byId("foot").innerHTML =
      '<dl class="tdb-limits">' +
        "<dt>Cells</dt><dd>" + defCells + "</dd>" +
        "<dt>Coverage</dt><dd>" + span + ". " + scopeNote + "</dd>" +
        "<dt>Accuracy</dt><dd>Solved / Tasks; &plusmn; is the 95% Wilson " +
          "half-width, about " + h50 + " points at 50% on " +
          esc(day.n_tasks) + " board tasks.</dd>" +
        "<dt>Outcomes</dt><dd>" + defOutcomes + "</dd>" +
        faNote +
        "<dt>Report</dt><dd>" + defReport + "</dd>" +
      "</dl>" +
      digest;
  }

  function show(day) {
    DAY = day;
    faUnlinked = false;
    heading(day);
    ALL = flatten(day);
    ALL.sort(function (a, b) { return b.rate - a.rate; });
    /* Ties share a rank and the next rank skips, as the reference does.
       Stamped ONTO THE ROW rather than kept in a side table keyed by
       model+scaffold: the row is what every later sort and filter carries
       around, so the rank cannot arrive at render out of step with it. */
    var last = null, lastRank = 0;
    ALL.forEach(function (r, i) {
      if (last === null || r.rate !== last) { lastRank = i + 1; last = r.rate; }
      r.rank = lastRank;
    });
    VIEW = ALL.slice();
    /* The columns are decided by the day too. If the sort key was carried in
       from the URL and names the column this day does not have, it falls back
       to the default rather than leaving every header reading `aria-sort=none`
       over a table that is nonetheless in some order. */
    /* The capability view is rebuilt from THIS DAY'S matrix on every day
       change, so a day whose matrix or catalogue could not be read has no
       capability chip rather than a chip that opens another day's table.
       `day` is the whole day file and buildCapability is handed it unchanged:
       it reads `matrix.tasks`, `matrix.rows`, `matrix.scaffold` and `date`,
       and the day file publishes all four under exactly those names --
       checked, not assumed, against all seven published day files. Nothing in
       buildCapability, capabilityAxes, capabilityRows or capabilitySummary
       reaches for a board-level field that only the whole-site snapshot has.

       This line used to read buildCapability(boardData, ...) -- the fixed
       2026-09-10 snapshot -- on every day, and the comment that stood here
       described the behaviour below as if it already followed the day. It did
       not: the capability table was 342 tasks x 33 models under all seven
       headers. The comment was right about the intent and wrong about the
       code, which is the worst of the two ways to be wrong, because it is the
       one that stops the next reader from looking. */
    CAP = capData ? buildCapability(day, capData, siteData) : null;
    /* A refused view has to SAY it was refused. Falling silently back to the
       board view hands a reader who followed a ?view=capability link a
       different table under the URL they clicked, with nothing on screen to
       distinguish "this day has no capability view" from "this is the
       capability view and it is empty". capNoteHtml() writes the sentence;
       the flag is what separates a reader who ASKED for the view from one who
       merely landed on a day where the chip is disabled. */
    var capWasRequested = (MODE === "capability");
    if (capWasRequested && !CAP) { MODE = MODE_DEFAULT; }
    paintCapNote(day, capWasRequested && !CAP);
    COLS = capMode() ? CAP.cols
      : (faColumn(ALL) ? COLS_BASE.concat([COL_FA]) : COLS_BASE.slice());
    if (!colByKey(sortKey)) {
      sortKey = SORT_KEY_DEFAULT;
      sortDir = SORT_DIR_DEFAULT;
    }
    /* The pills are painted from the day that is loaded, never from a fixed
       list: a scaffold that stops running has no pill the next day rather than
       a pill reading zero for a dimension that no longer exists. A selection
       carried in from the URL is kept only if this day actually has it. */
    facetValues = collectFacets(ALL);
    GROUPS.forEach(function (g) {
      if (facet[g] && facetValues[g].indexOf(facet[g]) < 0) { facet[g] = null; }
    });
    applyFilter();
    bindReproduce(day);
    renderFoot(day);
  }

  function load(id) {
    byId("count").textContent = "loading…";
    T.dayNav(byId("daynav"), { days: DAYS, active: id, onChange: load });
    T.dayData(id).then(show).catch(function (e) {
      T.loadError(byId("body").parentNode.parentNode.parentNode, "day " + id, e);
      byId("count").textContent = "";
    });
  }

  byId("q").addEventListener("input", applyFilter);
  /* Delegated, because both the header row and the pill rail are rebuilt by
     innerHTML on every keystroke; a listener bound to a button would be thrown
     away with it and the control would work exactly once. */
  byId("head").addEventListener("click", function (ev) {
    var b = ev.target && ev.target.closest
      ? ev.target.closest("button[data-key]") : null;
    if (!b) { return; }
    var k = b.getAttribute("data-key"), col = colByKey(k);
    if (!col || col.static) { return; }
    if (k === sortKey) { sortDir = (sortDir === "asc") ? "desc" : "asc"; }
    else { sortKey = k; sortDir = col.dir || "desc"; }
    applyFilter();
  });
  byId("views").addEventListener("click", function (ev) {
    var t = ev.target;
    var b = (t && t.closest) ? t.closest("button[data-view]") : null;
    if (!b || b.disabled) { return; }
    var v = b.getAttribute("data-view");
    if (v === MODE) { return; }
    MODE = v;
    /* Each view has its own columns, so a sort key carried over from the
       other one names nothing here. Falling back to the default is the only
       honest option: leaving it set would paint every header aria-sort="none"
       over a table that is nonetheless in some order. */
    sortKey = SORT_KEY_DEFAULT;
    sortDir = SORT_DIR_DEFAULT;
    COLS = capMode() ? CAP.cols
      : (faColumn(ALL) ? COLS_BASE.concat([COL_FA]) : COLS_BASE.slice());
    applyFilter();
    renderFoot(DAY);
  });
  byId("facets").addEventListener("click", function (ev) {
    var t = ev.target;
    if (!t || !t.closest) { return; }
    if (t.closest("#facet-reset")) {
      GROUPS.forEach(function (g) { facet[g] = null; });
      byId("q").value = "";
      applyFilter();
      return;
    }
    var b = t.closest("button[data-group]");
    if (!b) { return; }
    var g = b.getAttribute("data-group"), v = b.getAttribute("data-value");
    facet[g] = (facet[g] === v) ? null : v;
    applyFilter();
  });
  readUrl();
  byId("copy").addEventListener("click", function () {
    var b = byId("copy");
    navigator.clipboard.writeText(byId("cmd").textContent).then(function () {
      /* Restored to "Copy", which is what the markup ships. It restored a
         lowercase "copy", so the label was correct exactly once: the first
         click renamed the button permanently, and the button that told you it
         had worked was the evidence that something had not. */
      b.textContent = "Copied";
      setTimeout(function () { b.textContent = "Copy"; }, 1200);
    });
  });
  window.addEventListener("popstate", function () {
    var d = T.dayFromUrl(); if (d) load(d);
  });

  /* The two catalogues are fetched alongside the day index, so the first table
     this page draws already carries a runnable command and a capability chip
     that knows whether it can open. Either may fail on its own; T.fetchFailed
     says so on the page and hands back null, and the lines that needed it are
     omitted rather than filled with a guess.

     leaderboard_data.json is NOT fetched here any more. It was the third entry
     in this list and it fed exactly two things, the capability view and the
     discrimination digest, both of which are now computed from the day file
     show() was handed; see the declaration of siteData/capData at the top of
     this script for what the fixed-date snapshot was printing under six of the
     seven day headers. Fetching a file nothing reads would keep a stale global
     one edit away from being used again. */
  Promise.all([
    T.dayIndex(),
    T.getJSON("site_data.json").catch(T.fetchFailed("the task catalogue")),
    T.getJSON("data/capability.json").catch(T.fetchFailed("the capability axes"))
  ]).then(function (loaded) {
    var idx = loaded[0];
    siteData = loaded[1];
    capData = loaded[2];
    DAYS = idx.days;
    var want = T.dayFromUrl();
    var active = (want && DAYS.indexOf(want) >= 0) ? want : idx.latest;
    if (!active) {
      T.dayNav(byId("daynav"), { days: [], active: null, onChange: load });
      byId("count").textContent = "No published days";
      return;
    }
    load(active);
  }).catch(function (e) {
    T.loadError(byId("foot"), "the day index", e);
    byId("count").textContent = "";
  });
})();
</script>
</body>
</html>
