     list alone put NINE columns on any axis in total (C4 4, C5 4, C6 1, the
     other eleven axes 0). Not one axis reached min_tasks=5, so every column
     rendered as counts-without-a-rate or an em dash and the view showed
     nothing at all. `a.declared_unverified.task_ids` is the other list: the
     tasks whose own task.toml DECLARES the label but which withhold the oracle
     patch, so the generator could not re-derive it and refused to publish it as
     derived. Joining the union puts 19/49/21/317/326/68/7/14/1/9/16/0/36/35 on
     C1..C14 and clears the floor on twelve of the fourteen.

     The union is taken HERE and not in web/gen_capability_data.py. That
     generator's header promises that everything in `task_ids` was re-derived
     and checked against both stored copies; folding declared labels into it
     would make the promise false for every consumer of the file, including the
     ones that are not this page. The view is where a label can be joined AND
     carried with its provenance, so this is where it is done -- and the two
     counts stay apart on the axis object (nVerified, nDeclared) all the way to
     the cell, because the moment they are added into one number nothing
     downstream can tell a checked label from a claimed one. */
  function capabilityAxes(board, cap) {
    var CAPABILITY_NAMES = {
      C1: "Files and folders", C2: "Building software", C3: "Debugging", C4: "Implementation",
      C5: "Testing", C6: "Data processing", C7: "Networking", C8: "Security",
      C9: "System administration", C10: "Version control", C11: "Performance",
      C12: "Reverse engineering", C13: "Machine learning", C14: "Workflow automation"
    };
    var matrix = board && board.matrix;
    var ids = matrix && matrix.tasks;
    var axes = cap && cap.axes;
    if (!ids || !ids.length || !axes || !axes.length) { return null; }
    var at = {};
    ids.forEach(function (id, i) { at[id] = i; });
    var gate = (cap && cap.publish_gate) || {};
    var floor = (typeof gate.min_tasks === "number" && isFinite(gate.min_tasks))
      ? gate.min_tasks : null;
    return axes.map(function (a) {
      /* `seen` is what keeps the union a union. A task carrying the label in
         both lists -- which the catalogue does not currently emit, but nothing
         in its schema forbids -- would otherwise be counted twice in the
         denominator and scored twice in the numerator, inflating n past the
         number of tasks that exist. The re-derived list goes in first so that
         a task present in both is attributed to the stronger evidence. */
      var seen = {}, cols = [], nVerified = 0, nDeclared = 0;
      ((a && a.task_ids) || []).forEach(function (id) {
        if (!hasOwn(at, id) || hasOwn(seen, id)) { return; }
        seen[id] = 1; cols.push(at[id]); nVerified += 1;
      });
      var dec = (a && a.declared_unverified) || {};
      ((dec && dec.task_ids) || []).forEach(function (id) {
        if (!hasOwn(at, id) || hasOwn(seen, id)) { return; }
        seen[id] = 1; cols.push(at[id]); nDeclared += 1;
      });
      return {
        code: String((a && a.code) || ""),
        name: a && hasOwn(CAPABILITY_NAMES, a.code)
          ? CAPABILITY_NAMES[a.code] : String((a && a.name) || ""),
        cols: cols,
        n: cols.length,
        nVerified: nVerified,
        nDeclared: nDeclared,
        /* No published floor means no defensible ranking, not a default one. */
        minTasks: floor,
        ranked: (floor !== null) && (cols.length >= floor),
        half: resolution(cols.length)
      };
    });
  }

  function capabilityRows(board, axes) {
    var matrix = board && board.matrix;
    var rows = matrix && matrix.rows;
    var ids = matrix && matrix.tasks;
    if (!rows || !rows.length || !ids || !ids.length || !axes) { return null; }
    var all = ids.map(function (id, i) { return i; });
    var out = rows.map(function (row) {
      var by = {};
      var declared = board.aggregation && board.aggregation.trials_per_cell;
      axes.forEach(function (a) { by[a.code] = axisTally(row, a.cols, declared); });
      return {
        model: String((row && row.model) || ""),
        overall: axisTally(row, all, declared),
        axis: by
      };
    });
    out.sort(function (a, b) {
      var pa = overallPoint(a), pb = overallPoint(b);
      if (pa === null || pb === null) { return (pa === null) ? 1 : -1; }
      return pb - pa;
    });
    /* Rank is over the OVERALL column and travels with the row, exactly as on
       the main table, so sorting by an axis and coming back is possible. A
       model with nothing measured has no rank rather than the last one. */
    var last = false, lastRank = 0;
    out.forEach(function (r, i) {
      var p = overallPoint(r);
      if (p === null) { r.rank = null; return; }
      if (last === false || p !== last) { lastRank = i + 1; last = p; }
      r.rank = lastRank;
    });
    return out;
  }

  function overallPoint(r) {
    var estimate = r && pointEstimate(r.overall);
    return estimate ? estimate.p : null;
  }

  /* Whether a column's task set is fully re-derived, and the word the cell
     prints if it is not. A single declared task is enough to make the answer
     "declared": the reader is being told what the WEAKEST evidence in the
     denominator is, not the average of it, and an axis whose nDeclared the
     join left at zero says nothing rather than saying "re-derived" -- a badge
     of quality is not this function's job, only the warning is. The overall
     column and any caller passing a bare {ranked:true} axis therefore fall
     through to "" with no property access that could throw. */
  function provenanceWord(axis) {
    return (axis && axis.nDeclared) ? "declared" : "";
  }

  /* The peer mean is an unweighted mean of measured model rates in this
     date's matrix. Search and sorting never change its reference population.
     Small samples contribute observed rates, but never receive a comparison
     color or determine the comparison scale. */
  function capabilityColors(rows, axes) {
    var columns = {}, span = 0;
    [OVERALL_AXIS].concat(axes).forEach(function (axis) {
      var rates = [];
      rows.forEach(function (row) {
        var tally = axis.code === "overall" ? row.overall : row.axis[axis.code];
        var estimate = pointEstimate(tally);
        if (estimate !== null) { rates.push({ rate: estimate.p, n: tally.n }); }
      });
      var mean = rates.length ? rates.reduce(function (sum, item) { return sum + item.rate; }, 0) / rates.length : null;
      columns[axis.code] = { mean: mean, models: rates.length };
      if (axis.ranked && rates.length > 1) {
        rates.forEach(function (item) {
          if (typeof axis.minTasks === "number" && item.n < axis.minTasks) { return; }
          span = Math.max(span, Math.abs(item.rate - mean));
        });
      }
    });
    return { columns: columns, span: Math.max(0.05, Math.ceil(span * 20) / 20) };
  }

  function capColorStyle(amount, below) {
    var base = below === null ? [239, 246, 255] : [247, 247, 247];
    var end = below ? [173, 69, 7] : [30, 64, 175];
    var rgb = base.map(function (channel, i) {
      return Math.round(channel + (end[i] - channel) * Math.max(0, Math.min(1, amount)));
    });
    var linear = rgb.map(function (channel) {
      var value = channel / 255;
      return value <= 0.04045 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4);
    });
    var light = 0.2126 * linear[0] + 0.7152 * linear[1] + 0.0722 * linear[2];
    var ink = light > 0.179 ? "#000000" : "#ffffff";
    return "background-color:rgb(" + rgb.join(",") + ");color:" + ink;
  }

  function capHeatCell(t, axis, colors, mode) {
    var name = axis.name || "Overall";
    if (!t || !t.n) {
      return '<span class="tdb-cap-heat" data-state="missing" data-ranked="false" title="' +
        esc(name + ": no evaluated tasks. Missing results are not zero scores.") + '">&mdash;</span>';
    }
    var rate = pointEstimate(t).p;
    var small = typeof axis.minTasks === "number" && t.n < axis.minTasks;
    var ranked = !!axis.ranked && !small;
    var peer = colors && colors.columns[axis.code];
    var comparable = ranked && peer && peer.models > 1;
    var state = !ranked ? "small" : mode === "peers" && !comparable ? "uncompared" : "measured";
    var tooltip = name + ": " + T.pct(rate) + " across " + t.n + " evaluated tasks. ";
    if (axis.nDeclared) {
      tooltip += axis.nDeclared + " task labels have not been independently checked. ";
    }
    if (!ranked) {
      tooltip += typeof axis.minTasks === "number"
        ? "Small sample: at least " + axis.minTasks + " evaluated tasks are required for ranking. Color is neutral. "
        : "The minimum sample size is unpublished. This result is not ranked; color is neutral. ";
    }
    var style = "";
    if (mode === "peers") {
      if (peer && peer.mean !== null) {
        tooltip += "Peer mean: " + T.pct(peer.mean) + " across " + peer.models + " measured models in this date's matrix. ";
      }
      if (comparable) {
        var delta = rate - peer.mean;
        tooltip += (delta > 0 ? "+" : "") + (delta * 100).toFixed(1) + " percentage points " +
          (delta > 0 ? "above" : delta < 0 ? "below" : "from") + " the peer mean. ";
        style = capColorStyle(Math.abs(delta) / colors.span, delta < 0);
      } else if (ranked) {
        tooltip += "At least two measured models are needed for a peer comparison. Color is neutral. ";
      }
      tooltip += "Color scale: -" + (colors.span * 100).toFixed(0) + " to +" + (colors.span * 100).toFixed(0) +
        " percentage points. The displayed value remains success rate. Differences do not establish statistical significance.";
    } else {
      if (ranked) { style = capColorStyle(rate, null); }
      tooltip += "Color scale: 0% to 100% success rate.";
    }
    var provenance = axis.nDeclared ? "declared" : axis.nVerified ? "rederived" : "";
    return '<span class="tdb-cap-heat" data-state="' + esc(state) + '" data-ranked="' + (ranked ? "true" : "false") +
      '" data-rate="' + esc(rate) + '" data-n="' + esc(t.n) + '" data-provenance="' + esc(provenance) +
      '" title="' + esc(tooltip) + '" aria-label="' + esc(tooltip) + '"' + (style ? ' style="' + esc(style) + '"' : '') + '>' +
      '<span class="tdb-cap-estimate"><strong>' + esc(T.pct(rate)) + '</strong></span></span>';
  }

  function capAxisDescription(axis) {
    var text = axis.name + ". " + axis.n + " tasks";
    if (axis.nDeclared) { text += ", " + axis.nVerified + " checked labels and " + axis.nDeclared + " declared labels"; }
    text += ". ";
    if (!axis.ranked) {
      return text + (typeof axis.minTasks === "number" ? "At least " + axis.minTasks + " tasks are required for ranking." : "The minimum ranking sample is unpublished.");
    }
    return text + "Select to sort models by success rate; all displayed skills remain visible.";
  }

  function paintCapLegend() {
    var box = byId("cap-legend");
    box.hidden = !capMode();
    if (!capMode()) { box.innerHTML = ""; return; }
    var peers = capColor === "peers";
    var extent = capColors ? (capColors.span * 100).toFixed(0) : "0";
    var title = peers ? "Difference from this date's mean model success rate. A shared symmetric scale is used for every skill."
      : "The same 0% to 100% success-rate scale is used for every skill.";
    var legendHtml = '<span class="tdb-cap-key" title="' + esc(title + ' Gray: insufficient evidence. Dash: not evaluated.') + '"><span>' +
      (peers ? '-' + esc(extent) + ' pp' : '0%') + '</span><span class="tdb-cap-ramp" data-color="' +
      esc(capColor) + '" aria-hidden="true"></span><span>' + (peers ? '+' + esc(extent) + ' pp' : '100%') + '</span></span>';
    box.innerHTML = legendHtml;
  }

  function capCell(t, axis, display) {
    if (display) { return capHeatCell(t, axis, display.colors, display.mode); }
    if (!t || !t.n) { return '<span class="text-muted-foreground">&mdash;</span>'; }
    var small = axis && axis.minTasks !== null && t.n < axis.minTasks;
    var ranked = axis && axis.ranked && !small;
    var prov = axis && axis.nDeclared ? ' data-provenance="declared"' :
      (axis && axis.nVerified ? ' data-provenance="rederived"' : "");
    var counts = esc(t.n) + " tasks";
    var scoreHtml = T.scoreCell(t.solved, t.n, t.repeat);
    return '<div class="tdb-cap-cell" data-ranked="' + (ranked ? "true" : "false") + '"' + prov + '>' +
      scoreHtml + '<span class="tdb-cap-n">' + counts +
      (small ? '<span class="tdb-sample-note">small sample</span>' : '') + '</span></div>';
  }

  /* The column head's second line. Not a sentence -- a reading: what this
     column is measured on, where those labels came from, how wide the
     measurement is, and whether it is allowed to order the table.

     The provenance term is the exact split and not the cell's one word,
     because this is the only place on screen with room to say "4 re-derived,
     313 declared" -- and that ratio is the difference between a column the
     catalogue checked and a column that describes itself. A column with no
     declared task says nothing extra; the note is a warning, and a column
     that has earned no warning does not need a certificate. An axis carrying
     nothing has no provenance to state, so "no task" is still the whole
     line. */
  function axisNoteHtml(a) {
    if (!a.n) { return "no task"; }
    return esc(a.n) + (a.n === 1 ? " task" : " tasks") + (a.ranked ? "" : " · unranked");
  }

  function capColumns(axes, nTasks) {
    var shortNames = { C1: "Files", C2: "Build", C3: "Debug", C4: "Coding", C5: "Tests", C6: "Data",
      C7: "Network", C8: "Security", C9: "System", C10: "Version control", C11: "Speed", C12: "Reverse", C13: "Machine learning", C14: "Workflow" };
    var cols = [
      { key: "rank", label: "Rank", right: true, dir: "asc",
        value: function (r) { return r.rank; } },
      { key: "model", label: "Model", dir: "asc",
        value: function (r) { return r.model; } },
      { key: "overall", label: "Overall", right: true, dir: "desc",
        noteHtml: axisNoteHtml({ n: nTasks, half: resolution(nTasks), ranked: true }),
        value: overallPoint }
    ];
    axes.forEach(function (a) {
      cols.push({
        key: "cap:" + a.code,
        label: a.name,
        shortLabel: shortNames[a.code] || a.name,
        right: true, dir: "desc", axis: a,
        static: !a.ranked,
        noteHtml: axisNoteHtml(a),
        /* An unranked axis reads as blank in both directions, which is what
           sortRows already does with "never measured" -- so even a stale sort
           key arriving in the URL cannot produce an order. */
        value: function (r) {
          if (!a.ranked) { return null; }
          var t = r.axis[a.code];
          if (t && a.minTasks !== null && t.n < a.minTasks) { return null; }
          var estimate = pointEstimate(t);
          return estimate ? estimate.p : null;
        }
      });
    });
    return cols;
  }

  /* The overall column is always rankable: it is the column the rank is
     assigned from. Named rather than written inline so capCell() takes the
     same shape of argument from both of its call sites. */
  var OVERALL_AXIS = { code: "overall", name: "overall", ranked: true };

  function rankCell(r) {
    return (r.rank === null || r.rank === undefined)
      ? '<span class="text-muted-foreground">&mdash;</span>'
      : esc(r.rank);
  }

  /* Capability cells show majority scores; evaluated counts are in tooltips. */
  function renderCap(r) {
    /* Built before the markup expression rather than inside it, for the same
       reason accuracyCell() builds its bar first: the repository's escaping
       scan reads every concatenation that produces a '<' and reports any
       property access it cannot see run through a safe formatter. `r.overall`
       is a validated tally and OVERALL_AXIS is a constant, but a scanner that
       took the author's word for either would protect nothing. */
    var display = { colors: capColors, mode: capColor };
    var overall = capCell(r.overall, OVERALL_AXIS, display);
    var nameHtml = '<span class="tdb-cap-model" title="' + esc(r.model) + '">' + esc(T.modelLabel(r.model)) + '</span>';
    var out = '<tr data-slot="table-row" class="' + TR + '">' +
      cell(" tdb-cap-rank text-right tabular-nums text-muted-foreground", rankCell(r)) +
      cell(" tdb-cap-model-cell", nameHtml) +
      cell(" tdb-overall-cell", overall, "Overall");
    COLS.forEach(function (c) {
      if (c.axis) { out += cell(" tdb-score-cell", capCell(r.axis[c.axis.code], c.axis, display), c.axis.name); }
    });
    return out + "</tr>";
  }

  /* Everything the foot has to be able to say, counted from the join rather
     than written down. A number typed into a sentence stops being true the
     first time either input file is regenerated. */
  function capabilitySummary(board, axes, site) {
    var matrix = board && board.matrix;
    var ids = (matrix && matrix.tasks) || [];
    var labelled = {}, carriers = [], gestures = 0, empty = 0;
    /* Two task sets, counted apart for the same reason the axis keeps two
       counts: `labelled` is every task the view drew a column over, `derived`
       is the subset whose label the catalogue actually re-derived. The
       difference between the two sizes is the whole caveat this view carries,
       and it is counted here so the foot cannot quote a stale one. cols is
       built verified-first by capabilityAxes(), so the first nVerified entries
       are exactly the re-derived ones. */
    var derived = {};
    axes.forEach(function (a) {
      a.cols.forEach(function (j, k) {
        labelled[ids[j]] = 1;
        if (k < a.nVerified) { derived[ids[j]] = 1; }
      });
    });
    var nLabelled = Object.keys(labelled).length;
    var nDerived = Object.keys(derived).length;
    var axesDeclared = 0;
    axes.forEach(function (a) { if (a.nDeclared) { axesDeclared += 1; } });
    axes.forEach(function (a) {
      if (!a.n) { empty += 1; return; }
      /* A "carrier" is an axis covering four fifths or more of everything that
         carries any label: at that share its column is the overall column with
         a different heading, and saying so IS the finding. */
      if (nLabelled && a.n >= nLabelled * 0.8) { carriers.push(a); }
      else if (a.n > gestures) { gestures = a.n; }
    });
    /* Why the unlabelled tasks are unlabelled, taken from the catalogue's own
       status field rather than assumed. */
    var status = {};
    ((site && site.tasks) || []).forEach(function (t) {
      if (t && t.id) { status[t.id] = t.status || "unrecorded"; }
    });
    var unlabelled = 0, unlabelledLive = 0;
    ids.forEach(function (id) {
      if (hasOwn(labelled, id)) { return; }
      unlabelled += 1;
      if (status[id] === "live") { unlabelledLive += 1; }
    });
    return {
      nTasks: ids.length, nLabelled: nLabelled, nDerived: nDerived,
      axesDeclared: axesDeclared, nAxes: axes.length,
      unlabelled: unlabelled,
      unlabelledLive: unlabelledLive, carriers: carriers,
      gestures: gestures, empty: empty,
      models: ((matrix && matrix.rows) || []).length,
      scaffold: (matrix && matrix.scaffold) || null,
      date: (board && board.date) || null
    };
  }

  function buildCapability(board, cap, site) {
    var axes = capabilityAxes(board, cap);
    if (!axes) { return null; }
    var rows = capabilityRows(board, axes);
    if (!rows) { return null; }
    var gate = (cap && cap.publish_gate) || {};
    return {
      axes: axes,
      rows: rows,
      cols: capColumns(axes, ((board.matrix && board.matrix.tasks) || []).length),
      floor: (typeof gate.min_tasks === "number" && isFinite(gate.min_tasks))
        ? gate.min_tasks : null,
      summary: capabilitySummary(board, axes, site)
    };
  }

  /* The capability foot. It carries its OWN scope warning rather than
     inheriting the main table's: the grid under it is one scaffold and twelve
     models, the table it replaced is every model measured on the day under
     every configuration, and the two are one click apart. A reader who takes
     an axis column for a slice of the 152-row board has been misled by the
     control, not by the data. */
  function capFootHtml(day) {
    if (!CAP) { return ""; }
    var d = CAP.summary;
    var settings = splitScaffold(d.scaffold || "");
    var sample = CAP.floor === null ? "Small groups should be interpreted with care."
      : "At least " + esc(CAP.floor) + " evaluated tasks are needed to rank a capability.";
    return '<dl class="tdb-limits"><dt>Success rate</dt><dd>The share of evaluated tasks solved in each category. A task passes when more than half its runs succeed. Missing results are left out.</dd>' +
      '<dt>Coverage</dt><dd>' + esc(d.models) + ' models and ' + esc(d.nTasks) + ' tasks using ' +
      esc(T.agentLabel(settings.agent || "the published agent")) + '. Agent and effort settings may differ from the overall view.</dd>' +
      '<dt>Categories</dt><dd>' + esc(d.nLabelled) + ' of ' + esc(d.nTasks) + ' tasks have category labels. Unlabeled tasks do not imply missing skills. Some labels have not been independently checked.' +
      (d.carriers.length ? ' Broad categories can closely follow the overall score.' : '') + '</dd>' +
      '<dt>Small samples</dt><dd>' + sample + ' Gray cells remain visible but are not ranked.</dd>' +
      '<dt>Colors</dt><dd>Success rate uses a shared 0% to 100% scale. Relative to peers compares each rate with the unweighted mean for that skill among measured models in this date\'s matrix. Search does not change the reference group. Colors describe observed differences, not statistical significance.</dd></dl>' +
      '<p><a href="../guide/quality-methods/">Evaluation methods</a></p>';
  }

  /* Where the numbers came from, who produced them, how to add to them, and
     what the interval beside every rate actually means.

     The CI definition used to run four sentences: a worked table of half-widths
     at 5 / 30 / 50 percent, plus a closing note that rows scored on overlapping
     subsets make two independent intervals indicative rather than exact. Both
     are true and neither changes what a reader does with the number, so the
     definition is one parenthetical now. The half-width is still COMPUTED for
     this day's task count rather than quoted, because it moves with n.

     The closing "Displaying N of M available entries" is gone. It restated,
     three screens lower, the "Showing N of M entries" that sits directly above
     the table -- and being a second copy it needed its own live patch on every
     keystroke, which is a whole mechanism existing to keep a duplicate true.
     The line above the table is the one a reader filtering the table is
     looking at. */
  /* The column is gone; the state it reported is not. An em dash in that
     column meant UNMEASURED, never zero, and a reader who never sees the
     column has to be told the field exists and was not measured -- otherwise
     dropping 354 dashes silently promotes "we do not know" to "we never
     mentioned it". The count is interpolated so the sentence cannot outlive
     the day it describes, and the moment any cell publishes a number the
     column comes back and this term describes the evidence links instead. */
  function faTerm(nRows) {
    if (colByKey("fa")) {
      return "<dt>False accepts</dt><dd>" + (faUnlinked
        ? "Some displayed non-zero counts have no published evidence record."
        : "Displayed non-zero counts link to their evidence records.") + "</dd>";
    }
    return "<dt>False accepts</dt><dd>No semantic false-accept measurements are reported for the " +
      esc(nRows) + " evaluated model configurations.</dd>";
  }

  function renderFoot(day) {
    if (capMode()) { byId("foot").innerHTML = capFootHtml(day); return; }
    var effort = facet.effort ? "The selected reasoning effort is shown. "
      : "Each model starts at its highest tested reasoning effort. ";
    byId("foot").innerHTML = '<dl class="tdb-limits">' +
      '<dt>Success rate</dt><dd>The share of evaluated tasks solved. A task passes when more than half its runs succeed. Missing results are left out.</dd>' +
      '<dt>Run variation</dt><dd>The ± value is the sample standard deviation of accuracy across repeated runs on the same tasks. Thin lines show one standard deviation around the majority score. Results without complete repeat records omit the error bar.</dd>' +
      '<dt>Model settings</dt><dd>' + effort + 'Expand a model to compare its settings.</dd>' +
      '<dt>Comparisons</dt><dd>Models may have been tested on different task sets. Check the task counts before comparing scores. Preliminary results have not completed the full validation process.</dd></dl>' +
      '<p><a href="../guide/quality-methods/">Evaluation methods</a></p>';
  }

  function aggregationDescription(day) {
    var aggregation = day && day.aggregation;
    var rows = day && day.matrix && day.matrix.rows || [];
    if (!aggregation || !rows.some(function (row) { return T.repeatStats(row); })) return "Repeat records are unavailable for this date.";
    return "Tasks pass with at least " + (Math.floor(aggregation.trials_per_cell / 2) + 1) + " of " + aggregation.trials_per_cell + " successful runs. ± shows run standard deviation.";
  }

  function show(day) {
    DAY = day;
    expandedModels.clear();
    faUnlinked = false;
    heading(day);
    ALL = flatten(day);
    new URL(window.location.href).searchParams.getAll("expanded").forEach(function (model) {
      if (ALL.some(function (r) { return r.model === model; })) expandedModels.add(model);
    });
    ALL.sort(function (a, b) { return b.rate - a.rate; });
    /* Ties share a rank and the next rank skips, as the reference does.
       Stamped ONTO THE ROW rather than kept in a side table keyed by
       model+scaffold: the row is what every later sort and filter carries
       around, so the rank cannot arrive at render out of step with it. */
    var last = null, lastRank = 0;
    ALL.forEach(function (r, i) {
      if (last === null || r.rate !== last) { lastRank = i + 1; last = r.rate; }
      r.rank = lastRank;
    });
    VIEW = ALL.slice();
    /* The columns are decided by the day too. If the sort key was carried in
       from the URL and names the column this day does not have, it falls back
       to the default rather than leaving every header reading `aria-sort=none`
       over a table that is nonetheless in some order. */
    /* The capability view is rebuilt from THIS DAY'S matrix on every day
       change, so a day whose matrix or catalogue could not be read has no
       capability chip rather than a chip that opens another day's table.
       `day` is the whole day file and buildCapability is handed it unchanged:
       it reads `matrix.tasks`, `matrix.rows`, `matrix.scaffold` and `date`,
       and the day file publishes all four under exactly those names --
       checked, not assumed, against all seven published day files. Nothing in
       buildCapability, capabilityAxes, capabilityRows or capabilitySummary
       reaches for a board-level field that only the whole-site snapshot has.

       This line used to read buildCapability(boardData, ...) -- the fixed
       2026-09-10 snapshot -- on every day, and the comment that stood here
       described the behaviour below as if it already followed the day. It did
       not: the capability table was 342 tasks x 33 models under all seven
       headers. The comment was right about the intent and wrong about the
       code, which is the worst of the two ways to be wrong, because it is the
       one that stops the next reader from looking. */
    CAP = capData ? buildCapability(day, capData, siteData) : null;
    capColors = CAP ? capabilityColors(CAP.rows, CAP.axes) : null;
    if (CAP && capAxis !== "all" && !CAP.axes.some(function (a) { return a.code === capAxis; })) {
      capAxis = "all";
    }
    /* A refused view has to SAY it was refused. Falling silently back to the
       board view hands a reader who followed a ?view=capability link a
       different table under the URL they clicked, with nothing on screen to
       distinguish "this day has no capability view" from "this is the
       capability view and it is empty". capNoteHtml() writes the sentence;
       the flag is what separates a reader who ASKED for the view from one who
       merely landed on a day where the chip is disabled. */
    var capWasRequested = (MODE === "capability");
    if (capWasRequested && !CAP) { MODE = MODE_DEFAULT; }
    paintCapNote(day, capWasRequested && !CAP);
    COLS = capMode() ? CAP.cols
      : (faColumn(ALL) ? COLS_BASE.concat([COL_FA]) : COLS_BASE.slice());
    if (!colByKey(sortKey)) {
      sortKey = SORT_KEY_DEFAULT;
      sortDir = SORT_DIR_DEFAULT;
    }
    /* The pills are painted from the day that is loaded, never from a fixed
       list: a scaffold that stops running has no pill the next day rather than
       a pill reading zero for a dimension that no longer exists. A selection
       carried in from the URL is kept only if this day actually has it. */
    facetValues = collectFacets(ALL);
    GROUPS.forEach(function (g) {
      if (facet[g] && facetValues[g].indexOf(facet[g]) < 0) { facet[g] = null; }
    });
    applyFilter();
    bindReproduce(day);
    renderFoot(day);
  }

  function load(id) {
    var request = ++loadSequence;
    loadState = "loading";
    byId("count").textContent = "Loading…";
    byId("body").innerHTML = '<tr class="tdb-results-message"><td colspan="17" class="tdb-empty" role="status">Loading results…</td></tr>';
    byId("cap-legend").hidden = true;
    byId("view-note").hidden = true;
    byId("result-subtitle").hidden = true;
    byId("measurement-note").textContent = "";
    byId("foot").innerHTML = "";
    taskExplorer.clear("Loading task results…");
    insights.clear("Loading results…");
    resultsChanged();
    T.dayNav(byId("daynav"), { days: DAYS, active: id, onChange: load });
    T.dayData(id).then(function (day) {
      if (request !== loadSequence) return;
      loadState = "idle";
      show(day);
    }).catch(function (e) {
      if (request !== loadSequence) return;
      loadState = "error";
      byId("body").innerHTML = '<tr class="tdb-results-message"><td colspan="17" class="tdb-empty" role="status">Results could not be loaded. Choose another date or reload the page.</td></tr>';
      taskExplorer.clear("Results could not be loaded. Choose another date or reload the page.");
      insights.clear("Results could not be loaded. Choose another date or reload the page.");
      byId("count").textContent = "Results unavailable";
      console.error("Daily results could not be loaded", e);
      resultsChanged();
    });
  }

  byId("q").addEventListener("input", applyFilter);
  byId("body").addEventListener("click", function (ev) {
    if (capMode() || ev.target.closest("a")) { return; }
    var row = ev.target.closest("tr[data-model-group]");
    if (!row || !row.querySelector("button[data-model]")) { return; }
    var model = row.getAttribute("data-model-group");
    if (expandedModels.has(model)) { expandedModels.delete(model); }
    else { expandedModels.add(model); }
    applyFilter();
    var button = Array.from(byId("body").querySelectorAll("button[data-model]")).find(function (b) {
      return b.getAttribute("data-model") === model;
    });
    if (button) { button.focus({ preventScroll: true }); }
  });
  byId("facets").addEventListener("change", function (ev) {
    if (ev.target.id === "cap-axis") {
      capAxis = ev.target.value;
      applyFilter();
      byId("cap-axis").focus();
    } else if (ev.target.id === "cap-color") {
      capColor = ev.target.value === "peers" ? "peers" : "rate";
      applyFilter();
      byId("cap-color").focus();
    } else if (ev.target.matches("select[data-group]")) {
      var group = ev.target.getAttribute("data-group");
      facet[group] = ev.target.value || null;
      applyFilter();
      byId("facets").querySelector('select[data-group="' + group + '"]').focus();
    }
  });
  /* Delegated, because both the header row and the pill rail are rebuilt by
     innerHTML on every keystroke; a listener bound to a button would be thrown
     away with it and the control would work exactly once. */
  byId("head").addEventListener("click", function (ev) {
    var b = ev.target && ev.target.closest
      ? ev.target.closest("button[data-key]") : null;
    if (!b) { return; }
    var k = b.getAttribute("data-key"), col = colByKey(k);
    if (!col || col.static) { return; }
    if (k === sortKey) { sortDir = (sortDir === "asc") ? "desc" : "asc"; }
    else { sortKey = k; sortDir = col.dir || "desc"; }
    applyFilter();
  });
  byId("views").addEventListener("click", function (ev) {
    var t = ev.target;
    var b = (t && t.closest) ? t.closest("button[data-view]") : null;
    if (!b || b.disabled) { return; }
    var v = b.getAttribute("data-view");
    if (v === MODE) { return; }
    MODE = v;
    /* Each view has its own columns, so a sort key carried over from the
       other one names nothing here. Falling back to the default is the only
       honest option: leaving it set would paint every header aria-sort="none"
       over a table that is nonetheless in some order. */
    sortKey = SORT_KEY_DEFAULT;
    sortDir = SORT_DIR_DEFAULT;
    COLS = capMode() ? CAP.cols
      : (faColumn(ALL) ? COLS_BASE.concat([COL_FA]) : COLS_BASE.slice());
    applyFilter();
    renderFoot(DAY);
  });
  byId("facets").addEventListener("click", function (ev) {
    var t = ev.target;
    if (!t || !t.closest) { return; }
    if (t.closest("#facet-reset")) {
      GROUPS.forEach(function (g) { facet[g] = null; });
      byId("q").value = "";
      applyFilter();
      return;
    }
    var b = t.closest("button[data-group]");
    if (!b) { return; }
    var g = b.getAttribute("data-group"), v = b.getAttribute("data-value");
    facet[g] = (facet[g] === v) ? null : v;
    applyFilter();
  });
  readUrl();

  window.addEventListener("popstate", function () {
    readUrl();
    var d = T.dayFromUrl() || DAYS[0]; if (d) load(d);
  });

  /* The two catalogues are fetched alongside the day index, so the first table
     this page draws already carries a runnable command and a capability chip
     that knows whether it can open. Either may fail on its own; T.fetchFailed
     says so on the page and hands back null, and the lines that needed it are
     omitted rather than filled with a guess.

     leaderboard_data.json is NOT fetched here any more. It was the third entry
     in this list and it fed exactly two things, the capability view and the
     discrimination digest, both of which are now computed from the day file
     show() was handed; see the declaration of siteData/capData at the top of
     this script for what the fixed-date snapshot was printing under six of the
     seven day headers. Fetching a file nothing reads would keep a stale global
     one edit away from being used again. */
  Promise.all([
    T.dayIndex(),
    T.getJSON("site_data.json").catch(T.fetchFailed("the task catalogue")),
    T.getJSON("data/capability.json").catch(T.fetchFailed("the capability axes"))
  ]).then(function (loaded) {
    var idx = loaded[0];
    siteData = loaded[1];
    capData = loaded[2];
    DAYS = idx.days;
    var want = T.dayFromUrl();
    var active = (want && DAYS.indexOf(want) >= 0) ? want : idx.latest;
    if (!active) {
      T.dayNav(byId("daynav"), { days: [], active: null, onChange: load });
      byId("count").textContent = "No published days";
      return;
    }
    load(active);
  }).catch(function (e) {
    T.loadError(byId("foot"), "the day index", e);
    byId("count").textContent = "";
  });
})();
</script>
</body>
</html>
