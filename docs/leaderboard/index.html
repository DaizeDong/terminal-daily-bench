<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard — terminal-daily-bench</title>
<meta name="description" content="Per-day solve rates for every agent, model and reasoning effort measured on the terminal-daily-bench rotating suite.">
<link rel="stylesheet" href="../assets/tw.css?v=d064c7dcdd">
<link rel="stylesheet" href="../assets/tw-extra.css?v=d064c7dcdd">
<link rel="stylesheet" href="../assets/site.css?v=d064c7dcdd">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#9622;</text></svg>">
</head>
<body>

<main id="nd-home-layout" class="flex flex-1 flex-col pt-14">
  <div class="flex flex-1 flex-col items-center px-4 py-6 sm:pt-12">
    <div class="flex w-full max-w-7xl flex-col" data-tdb-canary-host>

      <nav aria-label="breadcrumb" data-slot="breadcrumb" class="mb-6 hidden font-mono sm:block">
        <ol data-slot="breadcrumb-list" class="text-muted-foreground flex flex-wrap items-center gap-1.5 text-sm break-words sm:gap-2.5">
          <li data-slot="breadcrumb-item" class="inline-flex items-center gap-1.5"><a data-slot="breadcrumb-link" class="hover:text-foreground transition-colors" href="../">Home</a></li>
          <li data-slot="breadcrumb-separator" role="presentation" aria-hidden="true" class="[&amp;>svg]:size-3.5"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></li>
          <li data-slot="breadcrumb-item" class="inline-flex items-center gap-1.5"><span data-slot="breadcrumb-page" role="link" aria-disabled="true" aria-current="page" class="text-foreground font-normal">Leaderboard</span></li>
        </ol>
      </nav>

      <div class="tdb-title-row">
        <h1 class="font-mono text-4xl tracking-tighter" id="title">leaderboard</h1>
        <div id="daynav"></div>
      </div>

      <figure class="tdb-cmd">
        <figcaption>Reproduce a row</figcaption>
        <code id="cmd">tdb run &lt;MODEL&gt; tasks/archive/&lt;task-id&gt; --harness &lt;agent&gt;</code>
        <button type="button" id="copy" aria-label="Copy command">copy</button>
        <a id="cmd-tasks" href="../benchmarks/">task ids &rarr;</a>
      </figure>

      <section class="flex flex-col">
        <div class="tdb-tablebar">
          <p id="count" class="text-muted-foreground font-mono text-sm">loading&hellip;</p>
          <label class="tdb-search">
            <span class="sr-only">Search leaderboard</span>
            <input id="q" type="search" placeholder="Search leaderboard" autocomplete="off">
          </label>
        </div>

        <div class="bg-card -mx-4 border-y font-mono md:mx-0 md:border-x">
          <div data-slot="table-container" class="relative w-full overflow-x-auto"
               data-tdb-primary-data>
            <table data-slot="table" class="w-full caption-bottom">
              <thead data-slot="table-header" id="head"></thead>
              <tbody data-slot="table-body" id="body"></tbody>
            </table>
          </div>
        </div>
        <div id="foot" class="tdb-foot" data-tdb-integrity></div>
      </section>

    </div>
  </div>
</main>

<script src="../assets/site.js?v=d064c7dcdd" data-root=".." data-page="leaderboard"></script>
<script src="../assets/tdb-data.js?v=d064c7dcdd"></script>
<script>
(function () {
  "use strict";
  var T = window.TDB;
  var esc = T.esc, TD = T.TD, TR = T.TR;
  var byId = function (id) { return document.getElementById(id); };

  /* One row per (model, scaffold). A scaffold id is "<agent>" or
     "<agent>@<effort>" -- claude-code@high, codex@low, terminus-2 -- so the
     reference's Agent / Effort split falls straight out of the id. An id with
     no "@" ran at the provider's default and says so, rather than being given a
     made-up effort name. */
  function splitScaffold(id) {
    var at = String(id).indexOf("@");
    return at < 0
      ? { agent: String(id), effort: null }
      : { agent: String(id).slice(0, at), effort: String(id).slice(at + 1) };
  }

  function flatten(day) {
    var out = [];
    (day.leaderboard || []).forEach(function (entry) {
      Object.keys(entry).forEach(function (k) {
        var cell = entry[k];
        if (!cell || typeof cell !== "object" || typeof cell.n !== "number") return;
        if (!cell.n) return;                       /* never measured: not a row */
        var s = splitScaffold(k);
        out.push({
          model: entry.model, agent: s.agent, effort: s.effort, scaffold: k,
          n: cell.n, solved: cell.solved,
          rate: (typeof cell.rate === "number") ? cell.rate : (cell.solved / cell.n),
          fa: cell.fa, fa_n: cell.fa_n
        });
      });
    });
    return out;
  }

  /* The point estimate carried with its uncertainty, as the reference does:
     the number is the claim, the interval is how much to trust it. At n=50 the
     half-width is around 13 points, and a reader who cannot see that will read
     a two-point gap as a ranking. */
  function accuracyCell(r) {
    var w = T.wilson(r.solved, r.n);
    var half = ((w.hi - w.lo) / 2) * 100;
    return '<p class="tdb-acc" title="' + esc(r.solved) + "/" + esc(r.n) + " — 95% CI [" +
      T.pct(w.lo) + ", " + T.pct(w.hi) + ']">' +
      "<strong>" + T.pct(w.p) + "</strong>" +
      '<span class="tdb-acc-ci">&plusmn; ' + half.toFixed(1) + "%</span></p>";
  }

  var COLS = [
    { key: "rank",   label: "Rank",  sortable: false },
    { key: "agent",  label: "Agent" },
    { key: "model",  label: "Model" },
    { key: "effort", label: "Effort", value: function (r) { return r.effort; } },
    { key: "rate",   label: "Accuracy", right: true },
    { key: "solved", label: "Solved",   right: true },
    { key: "n",      label: "Tasks",    right: true },
    { key: "fa",     label: "False accepts", right: true,
      value: function (r) { return (typeof r.fa === "number") ? r.fa : null; } }
  ];

  var ALL = [], VIEW = [], TABLE = null, DAYS = [], DAY = {};

  function render(r) {
    /* Rank is assigned once, over the whole day by accuracy, and then travels
       with the row. Re-ranking on every sort would make "rank" mean "position
       in whatever order you last clicked", which is not a rank. */
    var faCell = (typeof r.fa === "number")
      ? '<p class="text-right tabular-nums">' + esc(r.fa) + "/" + esc(r.fa_n) + "</p>"
      : '<p class="text-right text-muted-foreground">&mdash;</p>';
    return '<tr data-slot="table-row" class="' + TR + '">' +
      '<td class="' + TD + '"><p class="tabular-nums text-muted-foreground">' +
        esc(r.rank) + "</p></td>" +
      '<td class="' + TD + '"><p>' + esc(r.agent) + "</p></td>" +
      '<td class="' + TD + '"><p class="font-medium">' + esc(r.model) + "</p></td>" +
      '<td class="' + TD + '"><p class="text-muted-foreground">' +
        esc(r.effort || "default") + "</p></td>" +
      '<td class="' + TD + '">' + accuracyCell(r) + "</td>" +
      '<td class="' + TD + '"><p class="text-right tabular-nums">' + esc(r.solved) + "</p></td>" +
      '<td class="' + TD + '"><p class="text-right tabular-nums text-muted-foreground">' +
        esc(r.n) + "</p></td>" +
      '<td class="' + TD + '">' + faCell + "</td>" +
    "</tr>";
  }

  function applyFilter() {
    var q = byId("q").value.trim().toLowerCase();
    VIEW = !q ? ALL.slice() : ALL.filter(function (r) {
      return (r.model + " " + r.agent + " " + (r.effort || "")).toLowerCase().indexOf(q) >= 0;
    });
    byId("count").innerHTML =
      (q ? "Showing " + VIEW.length + " of " + ALL.length + " entries"
         : "Showing " + ALL.length + " entries") +
      '<span class="tdb-count-sep">&middot;</span>' + esc(DAY.n_tasks) + " tasks" +
      '<span class="tdb-count-sep">&middot;</span>' + esc(DAY.n_models) + " models" +
      '<span class="tdb-count-sep">&middot;</span>' + officialBadge(DAY);
    if (TABLE) TABLE.redraw(VIEW);
  }

  /* The reference names the benchmark version in the title -- "terminal-bench@2.1
     Leaderboard" -- and carries no summary cards at all. Ours rotates daily, so
     the day IS the version. Counts that were four cards are one line above the
     table, next to the entry count they belong with. */
  function heading(day) {
    byId("title").textContent = "terminal-daily@" + day.date;
    /* The command has to be one a reader can actually run. This block used to
       print `tdb run --suite <date> -a <agent> -m <model>`, invented by analogy
       with the reference site: `tdb run` takes a positional MODEL and TASK plus
       `--harness`, and none of those three flags exist. It sat behind a copy
       button, which is the worst place on the site to be wrong. The Agent
       column IS the --harness value, so a row maps onto the real command. */
    var t = byId("cmd-tasks");
    if (t) t.setAttribute("href", "../benchmarks/" + encodeURIComponent(day.date) + "/");
  }

  /* ------------------------------------------------------------------ *
   * The authority gate.
   *
   * "official" is a claim about provenance, not a field a publisher gets to
   * assert. Every condition below is independent and ALL must hold; any one
   * missing, of the wrong type, or absent from the day file leaves the day
   * unofficial. The failure this prevents is a single mis-set boolean turning
   * measured solve rates into a claimed ranking.
   *
   * Where the caveat text went: it is documentation, so it lives in the
   * documentation (guide/quality-methods/). What lives HERE is the code that
   * decides -- a page that explains the gate in a paragraph but does not run
   * it is worse than one that runs it silently.
   * ------------------------------------------------------------------ */
  var ALLOWED_DIMENSIONS = { overall: true, language: true, capability: true };

  /* The v3 relative-capability report, wherever the day file carries it. */
  function relativeReport(day) {
    var candidates = [day, day && day.relative_capability, day && day.relative_scoring];
    for (var i = 0; i < candidates.length; i++) {
      if (candidates[i] && candidates[i].schema_version === "td-relative-capability-v3") {
        return candidates[i];
      }
    }
    return null;
  }

  function formalAuthority(day) {
    var report = relativeReport(day);
    var scoring = (day && day.scoring) || {};
    var input = (report && report.input) || {};
    return !!report &&
      scoring.official_ranking === true &&
      scoring.publication_registry_mode === "code-controlled-allowlist" &&
      scoring.publication_bundle_approved === true &&
      scoring.relative_report_digest_matches === true &&
      scoring.anti_cheat_deployment_active === true &&
      input.frozen_task_roster_n === 50 &&
      input.task_roster_digest_trusted === true &&
      input.cell_manifest_digest_trusted === true;
  }

  /* A rating is shown as ranked only on a dimension the catalogue authorises
     and only when the rating itself is marked publishable with a real interval.
     Kept live so a v3 document dropped in later cannot bypass it. */
  function publishableRatings(day) {
    var report = relativeReport(day);
    if (!formalAuthority(day)) return [];
    var rows = [];
    (report.axes || []).forEach(function (axis) {
      if (!axis || !ALLOWED_DIMENSIONS[axis.dimension]) return;
      ["model", "harness", "configuration"].forEach(function (kind) {
        var table = axis.entities && axis.entities[kind];
        ((table && table.ratings) || []).forEach(function (rating) {
          if (rating && rating.publishable === true &&
              typeof rating.relative_score === "number" && Array.isArray(rating.ci)) {
            rows.push({ axis: axis.axis, kind: kind, rating: rating });
          }
        });
      });
    });
    return rows;
  }

  /* One badge, not a paragraph. */
  function officialBadge(day) {
    return formalAuthority(day)
      ? '<span class="tdb-badge" data-official="true">official</span>'
      /* A caveat behind a title= attribute does not exist on a phone and is
         easy to miss anywhere else. Print it, and link to what it means. */
      : '<span class="tdb-badge" data-official="false">unofficial</span>' +
        '<a class="tdb-badge-why" href="../guide/quality-methods/#outcomes">why</a>';
  }

  function show(day) {
    DAY = day;
    heading(day);
    ALL = flatten(day);
    ALL.sort(function (a, b) { return b.rate - a.rate; });
    /* Ties share a rank and the next rank skips, as the reference does.
       Stamped ONTO THE ROW rather than kept in a side table keyed by
       model+scaffold: the row is what every later sort and filter carries
       around, so the rank cannot arrive at render out of step with it. */
    var last = null, lastRank = 0;
    ALL.forEach(function (r, i) {
      if (last === null || r.rate !== last) { lastRank = i + 1; last = r.rate; }
      r.rank = lastRank;
    });
    VIEW = ALL.slice();
    TABLE = T.sortTable({
      head: byId("head"), body: byId("body"), cols: COLS,
      rows: VIEW, render: render, sort: "rate", dir: "desc"
    });
    applyFilter();
    /* Short declarative lines, the way the reference closes its table. */
    byId("foot").innerHTML =
      "<p>Results correspond to the <strong>" + esc(day.date) + "</strong> suite, " +
        esc(day.n_cells) + " model &times; task attempts.</p>" +
      /* Provenance. Nothing on the page said who produced these rows, so a
         reader could not tell a maintainer run from a self-reported one. */
      '<p>Rows are maintainer-run. Community results stay pending on the ' +
        '<a href="../submit/">submit page</a> until an operator replays them.</p>' +
      "<p>Accuracy is the Wilson 95% interval on solved/tasks; a run with no " +
        'accepted result is <a href="../guide/quality-methods/#outcomes">' +
        "not counted as a failure</a>.</p>" +
      /* /quality/ had one inbound link on the entire site, buried at the foot
         of the methods page. A reader looking at these rates is exactly the
         reader who wants to know whether the task set discriminates at all. */
      '<p>How well this suite separates models: <a href="../quality/">selection ' +
        "quality</a>.</p>" +
      '<p class="tdb-foot-count">Displaying ' + ALL.length + " of " + ALL.length +
        " available entries</p>";
  }

  function load(id) {
    byId("count").textContent = "loading…";
    T.dayNav(byId("daynav"), { days: DAYS, active: id, onChange: load });
    T.dayData(id).then(show).catch(function (e) {
      T.loadError(byId("body").parentNode.parentNode.parentNode, "day " + id, e);
      byId("count").textContent = "";
    });
  }

  byId("q").addEventListener("input", applyFilter);
  byId("copy").addEventListener("click", function () {
    var b = byId("copy");
    navigator.clipboard.writeText(byId("cmd").textContent).then(function () {
      b.textContent = "copied";
      setTimeout(function () { b.textContent = "copy"; }, 1200);
    });
  });
  window.addEventListener("popstate", function () {
    var d = T.dayFromUrl(); if (d) load(d);
  });

  T.dayIndex().then(function (idx) {
    DAYS = idx.days;
    var want = T.dayFromUrl();
    var active = (want && DAYS.indexOf(want) >= 0) ? want : idx.latest;
    if (!active) {
      T.dayNav(byId("daynav"), { days: [], active: null, onChange: load });
      byId("count").textContent = "no published days";
      return;
    }
    load(active);
  }).catch(function (e) {
    T.loadError(byId("foot"), "the day index", e);
    byId("count").textContent = "";
  });
})();
</script>
</body>
</html>
