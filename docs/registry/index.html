<body>

<main id="nd-home-layout" class="flex flex-1 flex-col pt-14">
  <!-- header is injected here by assets/site.js -->

  <div class="flex flex-1 flex-col items-center px-4 py-6 sm:pt-12">
    <div class="flex w-full max-w-7xl flex-1 flex-col" data-tdb-canary-host>

      <nav aria-label="breadcrumb" data-slot="breadcrumb" class="mb-6 hidden font-mono sm:block">
        <ol data-slot="breadcrumb-list" class="text-muted-foreground flex flex-wrap items-center gap-1.5 text-sm break-words sm:gap-2.5">

            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide"><path d="m9 18 6-6-6-6"></path></svg>
          </li>

      <h1 class="mb-2 font-mono text-4xl tracking-tighter">Tasks</h1>
      <p class="text-muted-foreground mb-6 font-mono text-sm">Search the published catalogue.</p>

      <!-- catalogue summary in the Terminal Daily metric-card system -->
      <div class="-mx-4 mb-6 flex flex-col sm:mx-0">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3" id="tdb-stats"></div>

      <p class="text-muted-foreground mb-6 font-mono text-sm" data-tdb-integrity>
        <span class="text-foreground">live</span> withholds gold and protected tests,
        <span class="text-foreground">archive</span> publishes them; both need the <a class="hover:text-foreground underline underline-offset-4" href="../guide/">unpublished patched Harbor fork</a>.
      </p>

      <!-- ==================== filterable table ==================== -->
      <div class="-mx-4 flex flex-col md:mx-0" data-tdb-primary-data>

            <div class="flex min-w-0 flex-wrap-reverse items-center justify-end gap-1" id="tdb-quick"></div>
          </div>

                     class="file:text-foreground placeholder:text-muted-foreground selection:bg-primary selection:text-primary-foreground border-input flex py-1 transition-[color,box-shadow] outline-none disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 focus-visible:border-ring focus-visible:ring-ring/50 bg-card dark:bg-card h-full w-full min-w-0 rounded-none border-0 px-4 font-mono text-base shadow-none focus-visible:ring-0 sm:text-sm"
                     placeholder="Search tasks by id, repo, title or PR number" autocomplete="off" spellcheck="false" value="">
              <button data-slot="button" data-variant="ghost" data-size="icon" id="tdb-clear" type="button" aria-label="Clear search"
                      class="shrink-0 items-center justify-center gap-2 text-sm font-medium whitespace-nowrap transition-all outline-none focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 hover:bg-accent dark:hover:bg-accent/50 size-9 text-muted-foreground hover:text-foreground absolute inset-y-0 right-0 h-full w-12 rounded-none shadow-none hidden">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide size-4"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
              </button>
            </div>

          <div class="bg-card -mb-px border-y font-mono md:border-x" id="tdb-facet-box" hidden>
            <div class="flex flex-wrap items-center gap-1 px-4 py-3" id="tdb-facets"></div>
            <!-- The capability taxonomy gets its own row rather than being mixed
                 into the flat rail above: it is a fourteen-axis map of the whole
                 declared taxonomy, not another handful of values, and reading it
                 as a map is the point. Its label and its chips are painted from
                 ../data/capability.json; the row stays hidden when that file
                 could not be read, because fourteen chips reading zero and a
                 catalogue that covers nothing look identical. -->
            <div class="flex flex-wrap items-center gap-1 border-t px-4 py-3" id="tdb-caps" hidden></div>
            <p class="text-muted-foreground px-4 pb-3 text-sm" id="tdb-facet-note"></p>
          </div>

                <tr data-slot="table-row" class="data-[state=selected]:bg-muted border-b transition-colors px-6 hover:bg-transparent" id="tdb-head"></tr>
              </thead>
              <tbody data-slot="table-body" class="[&amp;_tr:last-child]:border-0" id="tdb-rows">

                </tr>

        <div id="tdb-none" hidden></div>

      <p class="text-muted-foreground mt-6 font-mono text-sm">Not a score: a dash under <span class="text-foreground">Official solves</span> means awaiting formal coverage, not zero solves.</p>

<script src="../assets/site.js?v=a6e52a8c64" data-root=".." data-page="registry"></script>
<script>
(function () {
  "use strict";
  var T = window.TDB;

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* Shared table primitives; Terminal Daily presentation lives in site.css. */
  var TH = "text-foreground h-10 px-2 text-left align-middle font-medium whitespace-nowrap " +
           "[&:has([role=checkbox])]:pr-0 [&>[role=checkbox]]:translate-y-[2px] py-3 text-base";
  var TD = "p-2 align-middle whitespace-nowrap [&:has([role=checkbox])]:pr-0 " +
           "[&>[role=checkbox]]:translate-y-[2px] py-4 text-base";
  var TR = "hover:bg-muted/50 data-[state=selected]:bg-muted border-b transition-colors px-6 cursor-pointer";

  var SORT_BTN = "inline-flex shrink-0 items-center justify-center font-medium whitespace-nowrap " +
    "transition-all outline-none focus-visible:border-ring focus-visible:ring-[3px] " +
    "focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50 " +
    "[&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 " +
    "hover:bg-accent hover:text-accent-foreground dark:hover:bg-accent/50 h-8 gap-1.5 " +
    "rounded-md px-3 has-[>svg]:px-2.5 text-base";

  var CHIP = "inline-flex shrink-0 items-center justify-center gap-2 text-sm font-medium " +
    "whitespace-nowrap transition-all outline-none focus-visible:border-ring " +
    "focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:pointer-events-none " +
    "disabled:opacity-50 [&_svg]:pointer-events-none [&_svg]:shrink-0 " +
    "[&_svg:not([class*='size-'])]:size-4 border h-8 px-3 ";
  var CHIP_OFF = CHIP + "bg-background text-muted-foreground hover:bg-accent " +
    "hover:text-accent-foreground dark:border-input dark:bg-input/30 dark:hover:bg-input/50";
  var CHIP_ON = CHIP + "border-transparent bg-secondary text-secondary-foreground hover:bg-secondary/80";

  var BADGE = "inline-flex items-center justify-center border px-2 py-0.5 text-sm sm:text-xs " +
    "font-medium w-fit whitespace-nowrap shrink-0 [&>svg]:size-3 gap-1 " +
    "[&>svg]:pointer-events-none focus-visible:border-ring focus-visible:ring-ring/50 " +
    "focus-visible:ring-[3px] aria-invalid:ring-destructive/20 " +
    "dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive " +
    "transition-[color,box-shadow] overflow-hidden font-mono ";
  var BADGE_PRIMARY   = BADGE + "border-transparent bg-primary text-primary-foreground";
  var BADGE_SECONDARY = BADGE + "border-transparent bg-secondary text-secondary-foreground";
  var BADGE_OUTLINE   = BADGE + "text-foreground";

  var LINK = "hover:underline hover:underline-offset-4";
  var SVG_OPEN = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" ' +
    'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" class="lucide">';
  var I_UPDOWN = SVG_OPEN + '<path d="m7 15 5 5 5-5"></path><path d="m7 9 5-5 5 5"></path></svg>';
  var I_UP     = SVG_OPEN + '<path d="m18 15-6-6-6 6"></path></svg>';
  var I_DOWN   = SVG_OPEN + '<path d="m6 9 6 6 6-6"></path></svg>';
  var DASH = '<span class="text-muted-foreground">&mdash;</span>';

  /* ---------------------------------------------------------------------
     columns
     --------------------------------------------------------------------- */
  var COLS = [
    { key: "id",       label: "Task",      align: "left"  },
    { key: "repo",     label: "Repo",      align: "left"  },
    { key: "language", label: "Language",  align: "left"  },
    { key: "suite",    label: "Suite",     align: "left"  },
    { key: "status",   label: "Status",    align: "left"  },
    /* The facet rail filters on `declared_difficulty`; without a column for
       it, clicking "hard 43" returned 43 rows in which nothing said "hard".
       This is the EDITORIAL label from task.toml -- deliberately not the
       measured `difficulty`, which is "" on every task while no official
       ranking is published, and which gets its own column the day one is. */
    { key: "declared", label: "Difficulty", align: "left"  },
    /* The capability rail filters on a SET-valued label, so it gets a column
       for the same reason `declared` did: a filter for an attribute the table
       never renders is a dead end. The cell distinguishes three states that a
       single dash would flatten -- axes matched, no axis matched, and not
       taggable at all -- see `capCell`. */
    { key: "capability", label: "Capability", align: "left"  },
    { key: "f2p",      label: "F2P Tests", align: "right" },
    { key: "solved",   label: "Official Solves", align: "right" }
  ];

  var rowsEl  = document.getElementById("tdb-rows");
  var headEl  = document.getElementById("tdb-head");
  var countEl = document.getElementById("tdb-count");
  var noneEl  = document.getElementById("tdb-none");
  var statsEl = document.getElementById("tdb-stats");
  var quickEl = document.getElementById("tdb-quick");
  var facetEl = document.getElementById("tdb-facets");
  var facetBox = document.getElementById("tdb-facet-box");
  var capEl    = document.getElementById("tdb-caps");
  var noteEl   = document.getElementById("tdb-facet-note");
  var qEl     = document.getElementById("tdb-q");
  var clearEl = document.getElementById("tdb-clear");

  /* A quiet empty-state panel; `edges` selects its boundary treatment. */
  function emptyBlock(html, edges) {
    return '<div class="tdb-panel bg-card ' + (edges || "border-b") + ' px-6 py-8 text-sm ' +
      'text-muted-foreground md:border-x">' + html + "</div>";
  }

  /* Two independent reads, each with its own banner. The capability label set
     is NOT folded into site_data.json: that file is the scoring authority and
     is generated elsewhere, while the labels are catalogue metadata derived
     from the task packages. Keeping them apart means a missing label set
     cannot take the catalogue down with it, and vice versa -- and it means a
     failure to READ the labels is reported as such rather than drawn as a
     catalogue with no capabilities in it. */
  Promise.all([
    T.getJSON("site_data.json").catch(T.fetchFailed("the task catalogue")),
    T.getJSON("data/capability.json").catch(T.fetchFailed("the capability label set"))
  ]).then(function (loaded) { start(loaded[0], loaded[1]); });

  function start(site, cap) {
    /* The catalogue is the sole task authority. A result matrix cannot invent
       task rows or score fields when site_data.json is missing. */
    var tasks = (site && Array.isArray(site.tasks) && site.tasks.length)
      ? site.tasks.slice() : null;

    if (!tasks || !tasks.length) {
      /* Two bugs in one line before this: the entity was assigned through
         textContent, so readers saw a literal "&hellip;", and the branch that
         set it is the one where loading has FINISHED and found nothing -- the
         block immediately below says exactly that. A count that says "loading"
         after loading ended is a false claim, not a placeholder. */
      countEl.textContent = "0 entries";
      rowsEl.innerHTML = "";
      document.querySelector("[data-slot=table-container]").parentNode.hidden = true;
      noneEl.hidden = false;
      noneEl.innerHTML = emptyBlock(
        "<p>No task catalogue published yet.</p>" +
        "<p>Run <span class=\"text-foreground\">tdb publish</span> " +
        "to generate <span class=\"text-foreground\">site_data.json</span> at the site root.</p>",
        "border-y");
      statsEl.parentNode.hidden = true;
      return;
    }

    /* ---- capability axes -------------------------------------------------
       Read from ../data/capability.json. Nothing here comes from a solve
       matrix, which /registry/ deliberately never loads: an axis label is
       catalogue metadata, and no rate, score or gate verdict is drawn from it
       on this page. The gate lives on /quality/, next to the criteria it is
       computed from.

       `axes` is the FULL declared taxonomy, the axes no published package
       carries included. An axis missing from the rail and an axis sitting at
       zero are different claims, and only the second one is true here.

       Each axis carries TWO id lists, and the difference between them is the
       whole point:

         task_ids                       re-derived by the tagger from the
                                        package's own oracle patch and changed
                                        files -- a fact about the package;
         declared_unverified.task_ids   the task author's task.toml keywords,
                                        for a live package that withholds the
                                        patch the tagger would have read -- a
                                        claim about the package.

       Both are shown, and a row says which one it is. Flattening them into one
       "capability" would let an author's keyword pass for a measurement. */
    var axes = (cap && Array.isArray(cap.axes)) ? cap.axes : [];
    var catalogue = (cap && cap.catalogue) ? cap.catalogue : {};
    var capSpec = {};
    /* task id -> codes, kept in two separate indexes for the two evidence
       strengths; a task appears in exactly one of them. */
    var capReDerived = {}, capDeclared = {};

    function addCode(index, tid, code) {
      if (!index[tid]) index[tid] = [];
      if (index[tid].indexOf(code) < 0) index[tid].push(code);
    }

    axes.forEach(function (a) {
      if (!a || !a.code) return;
      capSpec[a.code] = a;
      (Array.isArray(a.task_ids) ? a.task_ids : []).forEach(function (tid) {
        addCode(capReDerived, tid, a.code);
      });
      var dec = a.declared_unverified || {};
      (Array.isArray(dec.task_ids) ? dec.task_ids : []).forEach(function (tid) {
        addCode(capDeclared, tid, a.code);
      });
    });

    function capPad(code) {
      return ("000" + String(code).replace(/[^0-9]/g, "")).slice(-3);
    }

    function capSortCodes(list) {
      return list.sort(function (x, y) { return capPad(x).localeCompare(capPad(y)); });
    }

    function capTitle(code) {
      var a = capSpec[code];
      return a ? (a.code + " " + a.name + ": " + a.description) : code;
    }

    /* Counted here rather than read off `axes[].n_tasks`, so a chip can never
       advertise a number the table cannot produce. The two agree today; the
       point is that they are forced to. */
    function capCount(code, index) {
      var n = 0;
      tasks.forEach(function (t) {
        if ((index[t.id] || []).indexOf(code) >= 0) n++;
      });
      return n;
    }

    var axesReDerived = 0, widest = null, widestN = 0;
    axes.forEach(function (a) {
      if (!a || !a.code) return;
      var n = capCount(a.code, capReDerived);
      if (n > 0) axesReDerived++;
      if (n > widestN) { widest = a; widestN = n; }
    });

    /* ---- summary ---- */
    var suiteSet = {}, langs = {}, diffs = {}, declared = {}, live = 0, f2p = 0, scoredTasks = 0;
    tasks.forEach(function (t) {
      T.taskSuites(t).forEach(function (sid) { suiteSet[sid] = 1; });
      if (t.language) langs[t.language] = (langs[t.language] || 0) + 1;
      if (t.difficulty) diffs[t.difficulty] = (diffs[t.difficulty] || 0) + 1;
      /* EDITORIAL label from task.toml. Distinct from t.difficulty, which is
         MEASURED and stays empty while official_ranking is false. */
      if (t.declared_difficulty) {
        declared[t.declared_difficulty] = (declared[t.declared_difficulty] || 0) + 1;
      }
      if (t.status === "live") live++;
      if (Number(t.n_models) > 0 && typeof t.solved_by === "number") scoredTasks++;
      f2p += Number(t.n_fail_to_pass) || 0;
    });

    var stats = [
      ["tasks",                tasks.length,                          "one merged pull request each"],
      ["suites",               Object.keys(suiteSet).length || 1,     "every day is its own sealed suite"],
      ["languages",            Object.keys(langs).length || null,     "mined across the ecosystem"],
      ["live now",             live,                                  "gold withheld, pending official replay"],
      ["protected f2p tests",  f2p || null,                           "re-laid over the agent's workspace"],
      ["official score coverage", scoredTasks ? scoredTasks + "/" + tasks.length : null,
        scoredTasks ? "bound to the formal matrix" : "no official matrix published"]
    ];
    /* Only when the label set was read. With `cap` null the honest statement
       is the banner at the top of the page, not a card reading 0/0. */
    if (cap && axes.length) {
      stats.push(["capability axes", axesReDerived + "/" + axes.length,
                  "of the declared taxonomy re-derived on a published package"]);
    }

    statsEl.innerHTML = stats.map(function (s) {
      return '<div data-slot="card" class="tdb-card bg-card text-card-foreground flex flex-col gap-6 ' +
        'border py-0 transition-all duration-200">' +
        '<div class="flex flex-1 flex-col justify-between gap-6 py-6">' +
          '<div data-slot="card-header" class="@container/card-header grid auto-rows-min ' +
            'grid-rows-[auto_auto] items-start gap-1.5 px-6 ' +
            'has-data-[slot=card-action]:grid-cols-[1fr_auto] [.border-b]:pb-6">' +
            '<p class="text-muted-foreground font-mono text-sm sm:text-xs">' + esc(s[0]) + "</p>" +
            '<p data-tdb-stat-value class="line-clamp-1 font-mono text-xl font-medium tabular-nums">' +
              (s[1] == null ? "&mdash;" : esc(s[1])) + "</p>" +
          "</div>" +
          '<div data-slot="card-content" class="px-6">' +
            '<p class="text-muted-foreground font-mono text-sm">' +
              esc(s[2]) + "</p>" +
          "</div>" +
        "</div></div>";
    }).join("");

    /* ---- filter state ---- */
    /* One list of groups, so the state, the reset, the leave-one-out counts
       and the row predicate can never drift out of step. Adding `capability`
       by hand to four of those five places is exactly how a facet ends up
       filtering nothing while its chip still lights up. */
    var GROUPS = ["language", "difficulty", "status", "declared", "capability"];

    function blankState() {
      var fresh = { q: "" };
      GROUPS.forEach(function (g) { fresh[g] = null; });
      return fresh;
    }

    var state = blankState();
    var sort  = { key: "suite", dir: "desc" };

    /* Facet group -> the task field it filters on. `declared` reads the
       editorial task.toml label; nothing here is derived from a solve matrix,
       which /registry/ deliberately never loads. `capability` is absent on
       purpose: an axis is not a field but membership in a set-valued label
       list, so it is matched by `facetMatches` instead of by equality. */
    var FACET_FIELD = {
      language: "language", difficulty: "difficulty",
      status: "status", declared: "declared_difficulty"
    };

    function facetMatches(t, group, value) {
      if (group === "capability") return t._caps.indexOf(value) >= 0;
      return t[FACET_FIELD[group]] === value;
    }

    /* Every ACTIVE facet except `skip`; pass null to apply them all. */
    function otherFacets(t, skip) {
      for (var i = 0; i < GROUPS.length; i++) {
        var g = GROUPS[i];
        if (g === skip || !state[g]) continue;
        if (!facetMatches(t, g, state[g])) return false;
      }
      return true;
    }

    function byCount(map) {
      return Object.keys(map).sort(function (a, b) {
        return map[b] - map[a] || a.localeCompare(b);
      });
    }

    /* A chip's number is what you would get if you clicked it: recount the
       catalogue with every OTHER active facet applied but this group ignored.
       The previous counts were computed once over all tasks and never updated,
       so a chip could advertise 43 while clicking it returned 2. */
    function looCount(group, value) {
      return tasks.filter(function (t) {
        if (state.q && t._h.indexOf(state.q) < 0) return false;
        if (!otherFacets(t, group)) return false;
        return facetMatches(t, group, value);
      }).length;
    }

    /* `opts.title` spells out an axis code; `opts.disabled` is for a chip whose
       leave-one-out count is zero. A chip that filters to nothing is a dead
       control, and there are two ways to deal with one: remove it, or show it
       as unavailable. For the taxonomy only the second is honest -- seven
       declared axes are carried by no published package, and an axis quietly
       missing from the rail reads as an axis that was never declared. So it
       stays, disabled, with its zero. */
    function chip(group, value, label, on, opts) {
      opts = opts || {};
      var attrs = 'type="button" data-slot="button" data-group="' + group +
        '" data-value="' + esc(value) + '" aria-pressed="' + (on ? "true" : "false") + '"';
      if (opts.title) attrs += ' title="' + esc(opts.title) + '"';
      if (opts.disabled) attrs += ' disabled aria-disabled="true"';
      return "<button " + attrs + ' class="' + (on ? CHIP_ON : CHIP_OFF) + '">' +
        esc(label) + "</button>";
    }

    /* The prose under the rail. Every number in it is counted right here;
       none is typed into the markup, and none of it is a solve rate. */
    function paintNote() {
      var html = "Declared difficulty is editorial: a <code>task.toml</code> label, not measured.";
      if (cap) {
        html += " Capability axes are catalogue metadata, not a score. For " +
          esc(catalogue.n_tasks_verifiable) + " of " + esc(catalogue.n_tasks) +
          " packages a deterministic rule-based tagger re-derives them from the " +
          "oracle patch and the changed files. The other " +
          esc(catalogue.n_tasks_unverifiable) + ' carry axes marked ' +
          '<span class="text-foreground">declared</span>: ' +
          esc(catalogue.unverifiable_reason) + ".";
        if (widest && widestN > 0) {
          html += " " + axesReDerived + " of " + axes.length + " declared axes are " +
            're-derived at all, and the widest, <span class="text-foreground">' +
            esc(widest.code + " " + widest.name) + "</span>, covers " + widestN +
            " of the " + esc(catalogue.n_tasks_verifiable) + " re-derived packages, so " +
            (widestN >= Number(catalogue.n_tasks_verifiable)
              ? "on this catalogue it separates nothing at all."
              : "on this catalogue it separates almost nothing.");
        }
        html += " A chip selects both kinds of evidence; the Capability column " +
          "says which kind each row has.";
      }
      noteEl.innerHTML = html;
    }

    function paintFilters() {
      var quick = chip("status", "live", "live " + looCount("status", "live"),
                       state.status === "live") +
                  chip("status", "archive", "archive " + looCount("status", "archive"),
                       state.status === "archive");
      var dirty = !!state.q || GROUPS.some(function (g) { return !!state[g]; });
      if (dirty) {
        quick += '<button type="button" data-slot="button" id="tdb-reset" class="' +
          CHIP_OFF + '">reset</button>';
      }
      quickEl.innerHTML = quick;

      var facets = "";
      byCount(langs).forEach(function (l) {
        facets += chip("language", l, l + " " + looCount("language", l),
                       state.language === l);
      });
      byCount(diffs).forEach(function (d) {
        facets += chip("difficulty", d, d + " " + looCount("difficulty", d),
                       state.difficulty === d);
      });
      byCount(declared).forEach(function (d) {
        facets += chip("declared", d, d + " " + looCount("declared", d),
                       state.declared === d);
      });
      facetEl.innerHTML = facets;

      /* Taxonomy order, not count order. This row is a coverage map of the
         whole declared taxonomy; sorting by count would sweep every empty axis
         to the tail, which is exactly where a reader stops looking and where
         "seven declared capabilities are carried by nothing" would stop being
         visible. */
      var caps = "";
      if (cap && axes.length) {
        caps = '<span class="text-muted-foreground shrink-0 text-sm">capability</span>';
        axes.forEach(function (a) {
          if (!a || !a.code) return;
          var n = looCount("capability", a.code);
          var rd = capCount(a.code, capReDerived);
          var dc = capCount(a.code, capDeclared);
          var why = rd + " re-derived, " + dc + " declared";
          if (rd + dc === 0) {
            why = "no published package carries this axis";
          } else if (n === 0) {
            why = why + "; no match under the current filters";
          }
          caps += chip("capability", a.code, a.code + " " + a.name + " " + n,
                       state.capability === a.code,
                       { title: capTitle(a.code) + " (" + why + ")", disabled: n === 0 });
        });
      }
      capEl.innerHTML = caps;
      capEl.hidden = !caps;

      paintNote();
      facetBox.hidden = !(facets || caps);
    }

    function onChipClick(ev) {
      var b = ev.target && ev.target.closest ? ev.target.closest("button[data-group]") : null;
      if (b) {
        var g = b.getAttribute("data-group"), v = b.getAttribute("data-value");
        state[g] = (state[g] === v) ? null : v;
        render();
        return;
      }
      if (ev.target && ev.target.closest && ev.target.closest("#tdb-reset")) {
        state = blankState();
        qEl.value = "";
        render();
        qEl.focus();
      }
    }
    quickEl.addEventListener("click", onChipClick);
    facetEl.addEventListener("click", onChipClick);
    /* The capability rail is a THIRD chip host. Without this line its chips
       painted their counts, took their aria-pressed state and did nothing:
       every click left all 61 rows on screen. */
    capEl.addEventListener("click", onChipClick);

    qEl.addEventListener("input", function () {
      state.q = qEl.value.trim().toLowerCase();
      render();
    });
    clearEl.addEventListener("click", function () {
      qEl.value = ""; state.q = ""; render(); qEl.focus();
    });

    /* ---- header ---- */
    function paintHead() {
      headEl.innerHTML = COLS.map(function (c) {
        var active = sort.key === c.key;
        var icon = !active ? I_UPDOWN : (sort.dir === "asc" ? I_UP : I_DOWN);
        var wrap = c.align === "right" ? "flex justify-end" : "flex";
        var btn = SORT_BTN + (c.align === "right" ? "" : " -ml-3");
        return '<th data-slot="table-head" class="' + TH + '" aria-sort="' +
          (active ? (sort.dir === "asc" ? "ascending" : "descending") : "none") + '">' +
          '<div class="' + wrap + '">' +
            '<button data-slot="button" data-variant="ghost" data-size="sm" type="button" ' +
              'data-sort="' + c.key + '" aria-label="Sort ' + esc(c.label) + '" class="' + btn + '">' +
              esc(c.label) + icon +
            "</button>" +
          "</div></th>";
      }).join("");
    }
    headEl.addEventListener("click", function (ev) {
      var b = ev.target && ev.target.closest ? ev.target.closest("button[data-sort]") : null;
      if (!b) return;
      var k = b.getAttribute("data-sort");
      if (sort.key === k) sort.dir = (sort.dir === "asc") ? "desc" : "asc";
      else { sort.key = k; sort.dir = (k === "f2p" || k === "solved") ? "desc" : "asc"; }
      render();
    });

    /* ---- derived per-task fields ---- */
    tasks.forEach(function (t) {
      t._f2p = (t.n_fail_to_pass == null) ? -1 : Number(t.n_fail_to_pass);
      t._solved = (typeof t.solved_by === "number") ? t.solved_by : -1;
      /* Three states, never two. `rederived` means the tagger read this
         package's own oracle patch; its verdict is a fact about the package,
         and the empty verdict is one of the things it can say. `declared`
         means the package withholds that patch, so what is shown is the task
         author's task.toml keyword -- a claim, and it is labelled as one.
         `unread` means the label FILE could not be fetched, which is not a
         statement about this package at all, so the cell falls back to the
         dash it uses for any other unknown and the banner at the top of the
         page carries the explanation. */
      var rd = capReDerived[t.id], dc = capDeclared[t.id];
      t._capState = !cap ? "unread" : (dc && !rd ? "declared" : "rederived");
      t._caps = capSortCodes((rd || dc || []).slice());
      t._capSort = (t._capState === "rederived")
        ? (t._caps.length ? "1 " + t._caps.map(capPad).join(" ") : "2")
        : ((t._capState === "declared") ? "3 " + t._caps.map(capPad).join(" ") : "4");

      /* Codes only in the haystack. The short NAMES would drag "test",
         "impl", "build" and "data" into the free-text index of nearly every
         row, so typing "test" would match the whole archive; the chips are
         where the names are readable anyway. */
      t._h = [t.id, t.repo, t.title, t.language, T.taskSuites(t).join(" "),
              t.status, t.difficulty, t.declared_difficulty, t._caps.join(" "),
              (t.pr_number != null ? "#" + t.pr_number : "")].join(" ").toLowerCase();
    });

    function sortVal(t, k) {
      if (k === "f2p") return t._f2p;
      if (k === "solved") return t._solved;
      if (k === "id") return String(t.id || "");
      if (k === "suite") return T.taskSuites(t).join(" ");
      if (k === "declared") return String(t.declared_difficulty || "");
      if (k === "capability") return t._capSort;
      return String(t[k] || "");
    }

    /* ---- one row ---- */
    function row(t) {
      var href = "./" + encodeURIComponent(t.id) + "/";
      var idCell = '<a class="' + LINK + '" href="' + esc(href) + '">' +
        esc(t.id) + "</a>";
      var title = t.title
        ? '<span class="text-muted-foreground block text-sm">' + esc(t.title) + "</span>"
        : "";

      var repoUrl = t.repo ? "https://github.com/" + t.repo : null;
      var repo = repoUrl
        ? '<a class="' + LINK + '" href="' + esc(repoUrl) + '" target="_blank" ' +
          'rel="noopener noreferrer">' + esc(t.repo) + "</a>"
        : DASH;
      var pr = (t.pr_number != null)
        ? '<span class="text-muted-foreground block text-sm sm:text-xs">' + (repoUrl
            ? '<a class="' + LINK + '" href="' + esc(repoUrl) + "/pull/" +
              encodeURIComponent(t.pr_number) + '" target="_blank" rel="noopener noreferrer">PR #' +
              esc(t.pr_number) + "</a>"
            : "PR #" + esc(t.pr_number)) + "</span>"
        : "";

      var lang = t.language
        ? '<span data-slot="badge" class="' + BADGE_OUTLINE + '">' + esc(t.language) + "</span>"
        : DASH;

      var suiteIds = T.taskSuites(t);
      var suite = suiteIds.length ? suiteIds.map(function (sid) {
        return '<a class="' + LINK + '" href="../benchmarks/' + encodeURIComponent(sid) +
          '/">' + esc(sid) + "</a>";
      }).join(", ") : DASH;

      var status = (t.status === "live")
        ? '<span data-slot="badge" class="' + BADGE_PRIMARY + '">live</span>'
        : '<span data-slot="badge" class="' + BADGE_SECONDARY + '">archive</span>';
      /* Was `t.difficulty` appended into the Status cell -- the MEASURED
         field, which is "" on all 61 tasks until an official ranking
         publishes, so the badge was never emitted and the difficulty facet
         filtered on a value the table never showed. */
      var declared = t.declared_difficulty
        ? '<span data-slot="badge" class="' + BADGE_OUTLINE + '" ' +
          'title="declared by the task author in task.toml; not measured">' +
          esc(t.declared_difficulty) + "</span>"
        : DASH;

      var capSuffix = (t._capState === "declared")
        ? '<span class="text-muted-foreground text-sm">declared</span>' : "";
      var caps;
      if (t._capState === "unread") {
        caps = DASH;
      } else if (t._caps.length) {
        caps = t._caps.map(function (code) {
          return '<span data-slot="badge" class="' + BADGE_OUTLINE + '" title="' +
            esc(capTitle(code)) + (t._capState === "declared"
              ? " (declared in task.toml by the task author; not re-derived, "
                + "because this package withholds the oracle patch)"
              : " (re-derived from the oracle patch of this package)") +
            '">' + esc(code) + "</span>";
        }).join("") + capSuffix;
      } else {
        caps = '<span class="text-muted-foreground text-sm" title="the tagger ran ' +
          'and no axis in the taxonomy matched">no axis</span>';
      }

      var n = Number(t.n_models) || 0;
      var solved = n && t._solved >= 0
        ? '<span class="tabular-nums">' +
          t._solved + "/" + n + "</span>"
        : DASH;

      return '<tr data-slot="table-row" class="' + TR + '" data-href="' + esc(href) +
          '" data-state="false">' +
        '<td data-slot="table-cell" class="' + TD + '"><p class="text-left">' +
          idCell + title + "</p></td>" +
        '<td data-slot="table-cell" class="' + TD + '"><p class="text-left">' +
          repo + pr + "</p></td>" +
        '<td data-slot="table-cell" class="' + TD + '"><p class="text-left">' + lang + "</p></td>" +
        '<td data-slot="table-cell" class="' + TD + '"><p class="text-left">' + suite + "</p></td>" +
        '<td data-slot="table-cell" class="' + TD + '"><p class="flex items-center gap-1 text-left">' +
          status + "</p></td>" +
        '<td data-slot="table-cell" class="' + TD + '"><p class="text-left">' + declared + "</p></td>" +
        '<td data-slot="table-cell" class="' + TD + '"><p class="flex items-center gap-1 text-left">' +
          caps + "</p></td>" +
        '<td data-slot="table-cell" class="' + TD + '"><p class="text-right tabular-nums">' +
          (t._f2p < 0 ? DASH : t._f2p) + "</p></td>" +
        '<td data-slot="table-cell" class="' + TD + '"><p class="text-right">' + solved + "</p></td>" +
      "</tr>";
    }

    /* Whole-row navigation keeps the catalogue fast to scan. */
    rowsEl.addEventListener("click", function (ev) {
      if (ev.target && ev.target.closest && ev.target.closest("a")) return;
      var tr = ev.target && ev.target.closest ? ev.target.closest("tr[data-href]") : null;
      if (tr) window.location.href = tr.getAttribute("data-href");
    });

    /* ---- render ---- */
    function render() {
      paintHead();
      paintFilters();
      clearEl.className = clearEl.className.replace(/ hidden$/, "");
      if (!state.q) clearEl.className += " hidden";

      var out = tasks.filter(function (t) {
        if (state.q && t._h.indexOf(state.q) === -1) return false;
        return otherFacets(t, null);
      });

      var k = sort.key, s = (sort.dir === "asc") ? 1 : -1;
      out.sort(function (a, b) {
        var x = sortVal(a, k), y = sortVal(b, k), c;
        if (typeof x === "number") c = x - y;
        else c = x.localeCompare(y);
        return c ? c * s : String(a.id).localeCompare(String(b.id));
      });

      countEl.textContent = (out.length === tasks.length)
        ? "Showing " + tasks.length + " entries"
        : "Showing " + out.length + " of " + tasks.length + " entries";

      if (!out.length) {
        rowsEl.innerHTML = "";
        noneEl.hidden = false;
        noneEl.innerHTML = emptyBlock("<p>Nothing matches that filter.</p>");
        return;
      }
      noneEl.hidden = true;
      rowsEl.innerHTML = out.map(row).join("");
    }

    render();
  }
})();
</script>
</body>
</html>
