name: Import attested replay receipt candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Exact successful promote-receipt workflow run id
        required: true
        type: string
      candidate_run_attempt:
        description: Exact promote-receipt workflow run attempt
        required: true
        type: string
      expected_candidate_sha256:
        description: Operator-pinned SHA-256 of canonical promotion-candidate.json
        required: true
        type: string

permissions: {}

concurrency:
  group: receipt-import-${{ inputs.expected_candidate_sha256 }}
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.repository == 'DaizeDong/terminal-daily-bench' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout exact main deployment declaration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Refuse to enter an authority environment for an inactive deployment
        shell: bash
        env:
          TDB_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TDB_AUTHORITY_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "${TDB_RUNNER_ENVIRONMENT}" = "github-hosted"
          test "${TDB_AUTHORITY_WORKFLOW_SHA}" = "${GITHUB_SHA}"
          python3 - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(
              Path(".github/receipt-authority/deployment.json").read_text("utf-8")
          )
          status = registry.get("deployment_status")
          declarations = registry.get("deployment_declarations")
          if (
              registry.get("schema")
              != "terminal-daily-receipt-authority-deployment/v1"
              or registry.get("active") is not True
              or type(status) is not dict
              or status.get("state") != "active"
              or status.get("blockers") != []
              or type(declarations) is not dict
              or not declarations
              or any(value is not True for value in declarations.values())
          ):
              raise SystemExit("receipt authority deployment is inactive")
          PY

  import:
    needs: preflight
    if: >-
      github.repository == 'DaizeDong/terminal-daily-bench' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: receipt-importer
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
      EXPECTED_CANDIDATE_SHA256: ${{ inputs.expected_candidate_sha256 }}
      TDB_AUTHORITY_ENVIRONMENT: receipt-importer
    steps:
      - name: Require exact hosted main authority context
        shell: bash
        env:
          TDB_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TDB_AUTHORITY_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "${TDB_RUNNER_ENVIRONMENT}" = "github-hosted"
          test "${TDB_AUTHORITY_WORKFLOW_SHA}" = "${GITHUB_SHA}"
          [[ "${CANDIDATE_RUN_ID}" =~ ^[1-9][0-9]{0,39}$ ]]
          [[ "${CANDIDATE_RUN_ATTEMPT}" =~ ^[1-9][0-9]{0,39}$ ]]
          [[ "${EXPECTED_CANDIDATE_SHA256}" =~ ^[0-9a-f]{64}$ ]]

      - name: Checkout exact main authority source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: authority
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Download candidate from the exact workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: replay-promotion-candidate-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: incoming
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Validate immutable checkout and artifact inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C authority rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f incoming/promotion-candidate.json
          test "$(find incoming -type f -print | LC_ALL=C sort)" = "incoming/promotion-candidate.json"

      - name: Select pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: authority/.github/receipt-promoter-requirements.txt

      - name: Install hash-locked authority dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            --require-hashes -r authority/.github/receipt-promoter-requirements.txt

      - name: Independently verify attestation and all deployment controls
        id: authority_import
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TDB_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TDB_AUTHORITY_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          python authority/web/receipt_authority.py import \
            --candidate incoming/promotion-candidate.json \
            --registry authority/.github/receipt-authority/deployment.json \
            --authority-root authority \
            --expected-run-id "${CANDIDATE_RUN_ID}" \
            --expected-run-attempt "${CANDIDATE_RUN_ATTEMPT}" \
            --expected-candidate-sha256 "${EXPECTED_CANDIDATE_SHA256}" \
            --out receipt-import-record.json \
            --blocked-out receipt-import-blocked.json

      - name: Attest the successful import record
        if: steps.authority_import.outcome == 'success'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: receipt-import-record.json

      - name: Publish the attested import for the independent publisher
        if: steps.authority_import.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replay-receipt-import-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipt-import-record.json
          if-no-files-found: error
          retention-days: 90

      - name: Preserve an explicitly unranked blocked decision
        if: failure() && hashFiles('receipt-import-blocked.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replay-receipt-import-blocked-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipt-import-blocked.json
          if-no-files-found: error
          retention-days: 30
