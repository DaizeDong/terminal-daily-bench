name: Build and deploy website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'web/**'
      - 'tests/**'
      - 'tools/make_fixtures.py'
      - 'terminal_daily_bench/**'
      - 'registry*.json'
      - 'pyproject.toml'
      - '.github/site-requirements.txt'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'web/**'
      - 'tests/**'
      - 'tools/make_fixtures.py'
      - 'terminal_daily_bench/**'
      - 'registry*.json'
      - 'pyproject.toml'
      - '.github/site-requirements.txt'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/site-requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install check dependencies
        run: python -m pip install -r .github/site-requirements.txt

      - name: Build website
        run: python web/build_site.py

      - name: Check pages and assets
        run: |
          python web/verify_site.py
          python web/asset_version.py --check

      - name: Check result data and website behavior
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest -q \
            tests/test_aggregate_leaderboard.py \
            tests/test_capability_ranking.py \
            tests/test_generated_details.py \
            tests/test_leaderboard_frontend.py \
            tests/test_model_efforts.py \
            tests/test_public_capability_metadata.py \
            tests/test_published_catalogue_membership.py \
            tests/test_release_features.py \
            tests/test_repeat_scores.py \
            tests/test_run_details.py \
            tests/test_site_exports.py \
            tests/test_site_geometry.py \
            tests/test_site_home_architecture.py \
            tests/test_site_insights.py \
            tests/test_site_membership.py \
            tests/test_site_routes.py \
            tests/test_task_explorer.py \
            tests/test_font_coverage.py \
            tests/test_vendor_harness.py

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
